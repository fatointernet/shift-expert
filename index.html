        const DYNAMIC_PLANNER_COLORS = [
            { bg: 'bg-rose-600', text: 'text-white' },
            { bg: 'bg-emerald-600', text: 'text-white' },
            { bg: 'bg-violet-700', text: 'text-white' },
            { bg: 'bg-cyan-400', text: 'text-slate-900' },
            { bg: 'bg-amber-500', text: 'text-white' },
            { bg: 'bg-lime-400', text: 'text-slate-900' },
            { bg: 'bg-slate-800', text: 'text-white' },
            { bg: 'bg-fuchsia-500', text: 'text-white' },
            { bg: 'bg-sky-700', text: 'text-white' },
            { bg: 'bg-orange-600', text: 'text-white' },
            { bg: 'bg-teal-300', text: 'text-slate-900' },
            { bg: 'bg-indigo-900', text: 'text-white' },
            { bg: 'bg-pink-300', text: 'text-slate-900' }
        ];

        const BASIC_PALETTE = [
            "#FF8A8A", "#FF0000", "#A52A2A", "#800000",
            "#000000", "#FFFFFF", "#FFFFE0", "#FFFF00",
            "#FFD580", "#FF8C00", "#D2691E", "#808000",
            "#90EE90", "#00FF00", "#32CD32", "#008000",
            "#98FB98", "#00FA9A", "#00FFFF", "#808080",
            "#ADD8E6", "#00BFFF", "#0000FF", "#00008B",
            "#191970", "#4682B4", "#008B8B", "#008080",
            "#E6E6FA", "#D8BFD8", "#800080", "#4B0082",
            "#FFC0CB", "#FF69B4", "#C71585", "#8B008B",
            "#FF00FF", "#9932CC", "#483D8B", "#F0F8FF"
        ];

        // --- UTILS ---
        const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        
        const parseTimeStr = (str) => {
            if (!str || !str.includes(':')) return parseFloat(str.replace(',', '.')) || 0;
            const [h, m] = str.split(':').map(Number);
            return h + (m / 60);
        };

        const formatTimeStr = (hours) => {
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            return `${h}:${String(m).padStart(2, '0')}`;
        };

        const Icon = React.memo(({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <span className={`inline-flex items-center justify-center ${className}`}><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        });

        // --- SUB-COMPONENTS ---

        const DonutChart = ({ data }) => {
            const total = data.reduce((acc, curr) => acc + curr.value, 0);
            let currentOffset = 0;
            if (total === 0) return (
                <div className="w-full h-full flex flex-col items-center justify-center bg-slate-50 rounded-full border-4 border-dashed border-slate-100">
                    <Icon name="pie-chart" size={60} className="text-slate-200 mb-2" />
                    <span className="text-[10px] font-black text-slate-300 uppercase">Sin datos</span>
                </div>
            );
            return (
                <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-2xl">
                    {data.map((item, idx) => {
                        const percentage = (item.value / total) * 100;
                        const dashArray = `${percentage} ${100 - percentage}`;
                        const offset = 100 - currentOffset + 25;
                        currentOffset += percentage;
                        return (
                            <circle key={idx} cx="50" cy="50" r="40" fill="transparent" stroke={item.color} strokeWidth="12" strokeDasharray={dashArray} strokeDashoffset={offset} className="transition-all duration-700 ease-out" />
                        );
                    })}
                    <circle cx="50" cy="50" r="28" fill="white" />
                    <text x="50" y="50" textAnchor="middle" dy="0.3em" className="font-black text-[8px] fill-slate-900 uppercase">Resumen</text>
                </svg>
            );
        };

        const PlannerView = ({ viewDate, setViewDate, annualPlan, setAnnualPlan, plannerCounters, setPlannerCounters, userColors, setUserColors, counterUsage, save, ui, setUi, activeTool, setActiveTool, weeklyRotation, setWeeklyRotation, shifts, setShifts }) => {
            const year = viewDate.getFullYear();
            const months = Array.from({ length: 12 }, (_, i) => i);
            const [toolActionModal, setToolActionModal] = useState(null);

            const combinedTools = useMemo(() => {
                const staticConceptTools = STATIC_CONCEPTS.map(c => ({
                    id: c.id,
                    label: c.label,
                    color: c.color,
                    textColor: c.textColor,
                    isBase: false,
                    isStatic: true
                }));
                const counterTools = plannerCounters.map((c, idx) => ({ 
                    id: `cnt_${c.id}`, 
                    rawId: c.id,
                    label: c.desc, 
                    color: DYNAMIC_PLANNER_COLORS[idx % DYNAMIC_PLANNER_COLORS.length].bg, 
                    textColor: DYNAMIC_PLANNER_COLORS[idx % DYNAMIC_PLANNER_COLORS.length].text, 
                    isBase: false,
                    isCustom: true
                }));
                return [...PLANNER_TOOLS, ...staticConceptTools, ...counterTools].map(t => ({ ...t, customColor: userColors[t.id] || null }));
            }, [plannerCounters, userColors]);

            const deleteCounter = (id) => {
                const n = plannerCounters.filter(c => c.id !== id);
                setPlannerCounters(n); 
                save(n, 'planner_counters');
                if (activeTool === `cnt_${id}`) setActiveTool(null);
            };

            const changeYear = (delta) => {
                const newDate = new Date(viewDate);
                newDate.setFullYear(year + delta);
                setViewDate(newDate);
            };

            const handleColorClick = (e, toolId) => {
                e.stopPropagation();
                const rect = e.currentTarget.getBoundingClientRect();
                setUi({ ...ui, colorPicker: { id: toolId, x: rect.right + 12, y: rect.top } });
            };

            const toggleRotation = (year, month, weekIdx) => {
                const key = `${year}-${month}-${weekIdx}`;
                const current = weeklyRotation[key];
                const next = current === 'M' ? 'T' : current === 'T' ? null : 'M';
                const nr = { ...weeklyRotation, [key]: next };
                setWeeklyRotation(nr);
                save(nr, 'weekly_rotation');
            };

            const syncFestive = (ds, toolId) => {
                const tool = combinedTools.find(t => t.id === toolId);
                if (tool && (tool.label.toUpperCase().includes("FIESTA") || tool.label.toUpperCase().includes("FESTIVO"))) {
                    const ns = { ...shifts, [ds]: { ...shifts[ds], isFestive: true } };
                    setShifts(ns);
                    save(ns, 'shifts');
                }
            };

            const applyConcept = (ds, toolId, hours = null) => {
                const newPlan = { ...annualPlan };
                let current = typeof newPlan[ds] === 'object' ? { ...newPlan[ds] } : { base: (newPlan[ds] === 'intensiva' || newPlan[ds] === 'partida' ? newPlan[ds] : null), concept: (newPlan[ds] && newPlan[ds] !== 'intensiva' && newPlan[ds] !== 'partida' ? newPlan[ds] : null) };
                current.concept = toolId;
                if (hours !== null) current.manualHours = hours;
                else delete current.manualHours;
                if (!current.base && !current.concept) delete newPlan[ds]; else newPlan[ds] = current;
                setAnnualPlan(newPlan); save(newPlan, 'annual_plan');
                syncFestive(ds, toolId);
                setToolActionModal(null);
            };

            const togglePlanDay = (ds) => {
                if (!activeTool) return;
                const tool = combinedTools.find(t => t.id === activeTool);
                if (!tool) return;
                if (tool.isBase) {
                    const newPlan = { ...annualPlan };
                    let current = typeof newPlan[ds] === 'object' ? { ...newPlan[ds] } : { base: (newPlan[ds] === 'intensiva' || newPlan[ds] === 'partida' ? newPlan[ds] : null), concept: (newPlan[ds] && newPlan[ds] !== 'intensiva' && newPlan[ds] !== 'partida' ? newPlan[ds] : null) };
                    current.base = current.base === activeTool ? null : activeTool;
                    if (!current.base && !current.concept) delete newPlan[ds]; else newPlan[ds] = current;
                    setAnnualPlan(newPlan); save(newPlan, 'annual_plan');
                } else {
                    if (tool.id === 'static_festivo') {
                        applyConcept(ds, tool.id);
                    } else {
                        setToolActionModal({ ds, toolId: tool.id, toolLabel: tool.label });
                    }
                }
            };

            const resetDay = (ds) => {
                const newPlan = { ...annualPlan };
                delete newPlan[ds];
                setAnnualPlan(newPlan); save(newPlan, 'annual_plan');
                setToolActionModal(null);
            };

            const updateCounter = (id, field, val) => {
                const n = plannerCounters.map(c => c.id === id ? { ...c, [field]: val } : c);
                setPlannerCounters(n); save(n, 'planner_counters');
            };

            const ToolActionModal = ({ data }) => {
                const [start, setStart] = useState("08:00");
                const [end, setEnd] = useState("16:00");
                const handleTimed = () => {
                    const [hS, mS] = start.split(":").map(Number);
                    const [hE, mE] = end.split(":").map(Number);
                    const totalHours = (hE + mE/60) - (hS + mS/60);
                    if (totalHours <= 0) return;
                    applyConcept(data.ds, data.toolId, totalHours);
                };
                return (
                    <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-in">
                        <div className="bg-white w-full max-sm rounded-[40px] shadow-2xl overflow-hidden border border-slate-100">
                            <div className="bg-slate-900 p-8 text-white">
                                <div className="flex justify-between items-start mb-2">
                                    <p className="text-[10px] font-black uppercase text-indigo-400 tracking-widest">Configuración de Imputación</p>
                                    <button onClick={() => setToolActionModal(null)} className="text-white/40 hover:text-white transition-colors"><Icon name="x" size={20} /></button>
                                </div>
                                <h4 className="text-xl font-black uppercase tracking-tight">{data.toolLabel}</h4>
                            </div>
                            <div className="p-8 space-y-6">
                                <div className="space-y-4">
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Definir Rango Horario</p>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-bold text-slate-400 uppercase ml-2">Entrada</label>
                                            <input type="time" className="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 font-black text-sm outline-none focus:ring-2 focus:ring-indigo-500" value={start} onChange={e => setStart(e.target.value)} />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-bold text-slate-400 uppercase ml-2">Salida</label>
                                            <input type="time" className="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 font-black text-sm outline-none focus:ring-2 focus:ring-indigo-500" value={end} onChange={e => setEnd(e.target.value)} />
                                        </div>
                                    </div>
                                    <button onClick={handleTimed} className="w-full py-4 bg-indigo-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-lg active:scale-95">Aplicar Minutos</button>
                                </div>
                                <div className="pt-6 border-t border-slate-50 grid grid-cols-1 gap-2">
                                    <button onClick={() => applyConcept(data.ds, toolId)} className="w-full py-4 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-800 transition-all active:scale-95 flex items-center justify-center gap-2"><Icon name="calendar-check" size={14} /> Día Completo</button>
                                    <button onClick={() => resetDay(data.ds)} className="w-full py-4 bg-red-50 text-red-500 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-red-100 transition-all active:scale-95 flex items-center justify-center gap-2"><Icon name="trash-2" size={14} /> Eliminar Día</button>
                                    <button onClick={() => setToolActionModal(null)} className="w-full py-3 text-slate-400 text-[10px] font-black uppercase tracking-widest hover:text-slate-600 transition-colors">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-12 animate-in relative">
                    {toolActionModal && <ToolActionModal data={toolActionModal} />}
                    {ui.colorPicker && (
                        <>
                            <div className="fixed inset-0 z-[110]" onClick={() => setUi({ ...ui, colorPicker: null })}></div>
                            <div className="fixed z-[120] bg-white p-5 rounded-[32px] shadow-[0_20px_50px_rgba(0,0,0,0.2)] border border-slate-100 w-[260px] animate-in" style={{ left: `${ui.colorPicker.x}px`, top: `${ui.colorPicker.y}px` }}>
                                <div className="flex justify-between items-center mb-4"><p className="text-[10px] font-black uppercase text-indigo-600 tracking-widest">Personalizar Color</p><button onClick={() => setUi({ ...ui, colorPicker: null })} className="p-1 hover:bg-slate-50 rounded-lg text-slate-300 hover:text-slate-600 transition-colors"><Icon name="x" size={16} /></button></div>
                                <div className="grid grid-cols-8 gap-2 mb-5">{BASIC_PALETTE.map(c => (<button key={c} onClick={() => { const nc = { ...userColors, [ui.colorPicker.id]: c }; setUserColors(nc); save(nc, 'userColors'); setUi({ ...ui, colorPicker: null }); }} className="w-5 h-5 rounded-md shadow-sm border border-black/5 hover:scale-125 hover:rotate-3 transition-transform active:scale-95" style={{ backgroundColor: c }}></button>))}</div>
                                <div className="border-t border-slate-50 pt-4">
                                    <label className="flex items-center justify-between cursor-pointer group bg-slate-50 p-2 rounded-xl border border-transparent hover:border-indigo-100 transition-all"><span className="text-[9px] font-black uppercase text-slate-400 group-hover:text-indigo-500">Selector Manual</span><div className="relative overflow-hidden w-7 h-7 rounded-full border-2 border-white shadow-sm"><input type="color" className="absolute inset-0 scale-150 cursor-pointer opacity-0" onChange={(e) => { const nc = { ...userColors, [ui.colorPicker.id]: e.target.value }; setUserColors(nc); save(nc, 'userColors'); }} /><div className="w-full h-full" style={{ backgroundColor: userColors[ui.colorPicker.id] || '#6366f1' }}></div></div></label>
                                    <button onClick={() => { const nc = { ...userColors }; delete nc[ui.colorPicker.id]; setUserColors(nc); save(nc, 'userColors'); setUi({ ...ui, colorPicker: null }); }} className="w-full mt-4 py-3 text-[9px] font-black uppercase text-red-400 bg-red-50 hover:bg-red-100 rounded-xl transition-colors">Restablecer Original</button>
                                </div>
                            </div>
                        </>
                    )}
                    <div className="flex justify-center items-center gap-8 bg-white py-6 rounded-[40px] shadow-lg border border-slate-100">
                        <button onClick={() => changeYear(-1)} className="p-4 bg-slate-50 rounded-2xl hover:bg-indigo-50 text-indigo-600 transition-all active:scale-95 shadow-sm border border-slate-100"><Icon name="chevron-left" size={24}/></button>
                        <h3 className="text-4xl font-black text-slate-900 tracking-tighter">{year}</h3>
                        <button onClick={() => changeYear(1)} className="p-4 bg-slate-50 rounded-2xl hover:bg-indigo-50 text-indigo-600 transition-all active:scale-95 shadow-sm border border-slate-100"><Icon name="chevron-right" size={24}/></button>
                    </div>
                    <div className="flex flex-col lg:flex-row gap-8">
                        <div className="lg:w-72 shrink-0 space-y-4">
                            <div className="bg-white p-6 rounded-[32px] shadow-xl border border-slate-100 sticky top-4">
                                <h4 className="text-[10px] font-black uppercase text-slate-400 mb-6 tracking-widest flex items-center gap-2"><Icon name="mouse-pointer-2" size={14} className="text-indigo-600" /> Marcador</h4>
                                <div className="space-y-2 max-h-[60vh] overflow-y-auto no-scrollbar pr-1">
                                    <div className="pb-2 mb-2 border-b border-slate-50">
                                        <p className="text-[8px] font-black text-slate-300 uppercase mb-2">Jornada Base (Esquina)</p>
                                        {combinedTools.filter(t => t.isBase).map(tool => (
                                            <button key={tool.id} onClick={() => setActiveTool(activeTool === tool.id ? null : tool.id)} className={`w-full text-left p-3 rounded-2xl text-[9px] font-black uppercase transition-all border-2 flex items-center justify-between mb-1 ${activeTool === tool.id ? 'border-indigo-600 bg-indigo-50 shadow-md ring-4 ring-indigo-50' : 'border-transparent text-slate-500 hover:bg-slate-50'}`}><span className="truncate pr-2">{tool.label}</span><div onClick={(e) => handleColorClick(e, tool.id)} className={`w-5 h-5 rounded-full shrink-0 border border-black/5 shadow-sm cursor-crosshair hover:scale-125 transition-transform ${tool.customColor ? '' : tool.color}`} style={tool.customColor ? { backgroundColor: tool.customColor } : {}}></div></button>
                                        ))}
                                    </div>
                                    <p className="text-[8px] font-black text-slate-300 uppercase mb-2">Conceptos / Bolsas</p>
                                    {combinedTools.filter(t => !t.isBase).map(tool => (
                                        <div key={tool.id} className="relative group">
                                            <button onClick={() => setActiveTool(activeTool === tool.id ? null : tool.id)} className={`w-full text-left p-3 rounded-2xl text-[9px] font-black uppercase transition-all border-2 flex items-center justify-between ${activeTool === tool.id ? 'border-indigo-600 bg-indigo-50 shadow-md ring-4 ring-indigo-50' : 'border-transparent text-slate-500 hover:bg-slate-50'}`}>
                                                <span className="truncate pr-8">{tool.label}</span>
                                                <div onClick={(e) => handleColorClick(e, tool.id)} className={`w-5 h-5 rounded-full shrink-0 border border-black/5 shadow-sm cursor-crosshair hover:scale-125 transition-transform ${tool.customColor ? '' : tool.color}`} style={tool.customColor ? { backgroundColor: tool.customColor } : {}}></div>
                                            </button>
                                            {tool.isCustom && (
                                                <button onClick={(e) => { e.stopPropagation(); deleteCounter(tool.rawId); }} className="absolute right-10 top-1/2 -translate-y-1/2 p-1.5 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="trash-2" size={12} /></button>
                                            )}
                                            {tool.isStatic && (
                                                <div className="absolute right-10 top-1/2 -translate-y-1/2 p-1.5 text-slate-200" title="Concepto Fijo"><Icon name="lock" size={12} /></div>
                                            )}
                                        </div>
                                    ))}
                                    <button onClick={() => setActiveTool(null)} className="w-full mt-4 text-center py-3 text-[10px] font-black text-red-500 uppercase tracking-widest border-t border-slate-50 hover:bg-red-50 rounded-b-2xl">Limpiar Selección</button>
                                </div>
                            </div>
                        </div>
                        <div className="flex-1 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                            {months.map(m => {
                                const dInM = new Date(year, m + 1, 0).getDate(), fD = (new Date(year, m, 1).getDay() + 6) % 7, mName = new Date(year, m, 1).toLocaleDateString('es-ES', { month: 'long' });
                                return (
                                    <div key={m} className="bg-white p-6 rounded-[32px] shadow-lg border border-slate-100 flex flex-col">
                                        <h5 className="text-xs font-black uppercase text-slate-800 mb-4 text-center tracking-[0.2em]">{mName}</h5>
                                        <div className="grid grid-cols-[2rem_repeat(7,1fr)] gap-1">
                                            <div className="text-[8px] font-black text-slate-200 text-center py-1"></div>
                                            {['L','M','X','J','V','S','D'].map(d => <div key={d} className="text-[8px] font-black text-slate-300 text-center py-1">{d}</div>)}
                                            {Array.from({ length: 42 }).map((_, globalIdx) => {
                                                const d = globalIdx - fD + 1;
                                                const weekIdx = Math.floor(globalIdx / 7);
                                                const isStartOfWeek = globalIdx % 7 === 0;
                                                const key = `${year}-${m}-${weekIdx}`;
                                                const rot = weeklyRotation[key];

                                                if (isStartOfWeek) {
                                                    return (
                                                      <React.Fragment key={`row-${weekIdx}`}>
                                                        <button onClick={() => toggleRotation(year, m, weekIdx)} className={`h-8 flex items-center justify-center rounded-lg text-[9px] font-black border transition-all ${rot ? 'bg-indigo-600 text-white border-indigo-700 shadow-sm' : 'bg-slate-50 text-slate-200 border-transparent hover:border-slate-200'}`}>
                                                            {rot || '-'}
                                                        </button>
                                                        {d > 0 && d <= dInM ? (
                                                            <PlannerDayCell key={d} d={d} ds={toISO(new Date(year, m, d))} annualPlan={annualPlan} combinedTools={combinedTools} togglePlanDay={togglePlanDay} />
                                                        ) : <div key={`empty-${globalIdx}`} className="h-8"></div>}
                                                      </React.Fragment>
                                                    );
                                                }

                                                if (d > 0 && d <= dInM) {
                                                    return <PlannerDayCell key={d} d={d} ds={toISO(new Date(year, m, d))} annualPlan={annualPlan} combinedTools={combinedTools} togglePlanDay={togglePlanDay} />;
                                                }
                                                return <div key={`empty-${globalIdx}`} className="h-8"></div>;
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                    <div className="bg-white p-8 rounded-[48px] shadow-2xl border border-slate-100 overflow-hidden">
                        <div className="flex items-center gap-4 mb-8"><div className="p-3 bg-indigo-600 rounded-2xl text-white shadow-lg"><Icon name="database" size={20} /></div><div><h4 className="text-lg font-black text-slate-800 tracking-tight">Conceptos y Bolsas de Horas</h4><p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Gestión de Saldos y Cálculo de Consumo</p></div></div>
                        <div className="overflow-x-auto no-scrollbar">
                            <table className="w-full text-left min-w-[850px]">
                                <thead><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-50"><th className="pb-4 px-4">Concepto / Año</th><th className="pb-4 px-4 text-right">Total Bolsa</th><th className="pb-4 px-4 text-right">Consumido</th><th className="pb-4 px-4 text-right">Saldo Restante</th><th className="pb-4 px-4 text-center w-20">Acciones</th></tr></thead>
                                <tbody className="divide-y divide-slate-50">
                                    {plannerCounters.map((c, idx) => {
                                        const u = counterUsage[`cnt_${c.id}`] || 0, t = parseTimeStr(c.val), r = t - u;
                                        const customColor = userColors[`cnt_${c.id}`];
                                        return <tr key={c.id} className="group hover:bg-slate-50/50 transition-all"><td className="py-4 px-4 flex items-center gap-3"><div onClick={(e) => handleColorClick(e, `cnt_${c.id}`)} className={`w-4 h-4 rounded-full shrink-0 border border-black/5 cursor-crosshair hover:scale-125 transition-all shadow-sm ${customColor ? '' : DYNAMIC_PLANNER_COLORS[idx % DYNAMIC_PLANNER_COLORS.length].bg}`} style={customColor ? { backgroundColor: customColor } : {}}></div><input type="text" className="w-full bg-transparent text-xs font-black text-slate-700 uppercase outline-none focus:text-indigo-600 focus:bg-indigo-50/50 rounded-lg px-2 py-1 transition-all" value={c.desc} onChange={e => updateCounter(c.id, 'desc', e.target.value)} /></td><td className="py-4 px-4 text-right"><input type="text" className="w-24 bg-slate-50 text-xs font-black text-slate-900 text-right outline-none focus:ring-2 focus:ring-indigo-200 rounded-lg px-3 py-1.5 transition-all border border-slate-100" value={c.val} onChange={e => updateCounter(c.id, 'val', e.target.value)} /></td><td className="py-4 px-4 text-right font-black text-xs text-red-500">{formatTimeStr(u)}h</td><td className={`py-4 px-4 text-right font-black text-xs ${r < 0 ? 'text-red-600' : 'text-emerald-600'}`}>{formatTimeStr(r)}h</td><td className="py-4 px-4 text-center"><button onClick={() => deleteCounter(c.id)} className="p-2 text-slate-200 hover:text-red-500 transition-colors"><Icon name="trash-2" size={16} /></button></td></tr>;
                                    })}
                                </tbody>
                            </table>
                        </div>
                        <div className="mt-8 pt-8 border-t border-slate-50 flex justify-end"><button onClick={() => { const nI = plannerCounters.length > 0 ? Math.max(...plannerCounters.map(c => c.id)) + 1 : 1; const nC = [...plannerCounters, { id: nI, desc: "NUEVO CONCEPTO", val: "00:00" }]; setPlannerCounters(nC); save(nC, 'planner_counters'); }} className="flex items-center gap-2 px-6 py-3 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-indigo-600 transition-all shadow-xl active:scale-95"><Icon name="plus" size={14} /> Añadir Concepto</button></div>
                    </div>
                </div>
            );
        };

        const PlannerDayCell = ({ d, ds, annualPlan, combinedTools, togglePlanDay }) => {
            const p = annualPlan[ds];
            const bId = typeof p === 'object' ? p.base : (p === 'intensiva' || p === 'partida' ? p : null);
            const cId = typeof p === 'object' ? p.concept : (p && p !== 'intensiva' && p !== 'partida' ? p : null);
            const tC = combinedTools.find(t => t.id === cId), tB = combinedTools.find(t => t.id === bId);
            return (
                <div onClick={() => togglePlanDay(ds)} className={`planner-day h-8 flex items-center justify-center rounded-lg text-[10px] font-black cursor-pointer border shadow-sm transition-all ${tC ? (tC.customColor ? '' : tC.color) : 'bg-slate-50 text-slate-400 border-transparent hover:border-indigo-100'}`} style={tC && tC.customColor ? { backgroundColor: tC.customColor, color: '#fff', textShadow: '0 1px 2px rgba(0,0,0,0.2)' } : {}}>{tB && <div className="corner-base" style={{ borderLeftColor: 'transparent', borderTopColor: tB.customColor || (tB.id === 'intensiva' ? '#facc15' : '#cbd5e1') }}></div>}{d}{p?.manualHours !== undefined && <div className="absolute bottom-0 right-0 bg-white/40 px-0.5 rounded-[2px] text-[5px] font-bold text-slate-700 leading-none">{formatTimeStr(p.manualHours)}</div>}</div>
            );
        };

        const PriceConfigPage = ({ globalRates, setGlobalRates, salaryMatrix, setSalaryMatrix, profile, save }) => {
            const [lG, slG] = useState(globalRates), [lM, slM] = useState(salaryMatrix);
            const sv = () => { setGlobalRates(lG); setSalaryMatrix(lM); save(lG, 'globalRates'); save(lM, 'salaryMatrix'); };
            return (
                <div className="space-y-12 animate-in pb-20">
                    <section className="bg-white p-8 rounded-[40px] shadow-xl border border-slate-100"><div className="flex justify-between items-center mb-10"><div><h3 className="text-xl font-black uppercase tracking-tight">Tarifas Globales</h3></div><button onClick={sv} className="px-8 py-3 bg-indigo-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-lg active:scale-95">Guardar</button></div><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">{Object.entries(lG).map(([k, v]) => (<div key={k} className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase ml-2 leading-tight block">{GLOBAL_LABELS[k] || k}</label><div className="relative"><input type="number" step="0.01" className="w-full bg-slate-50 p-4 rounded-2xl border-2 border-slate-100 font-black text-slate-800 outline-none" value={v} onChange={e => slG({...lG, [k]: parseFloat(e.target.value) || 0})} /><span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 font-black text-[10px]">€</span></div></div>))}</div></section>
                    <section className="bg-slate-900 p-8 rounded-[40px] shadow-2xl overflow-x-auto no-scrollbar"><h3 className="text-xl font-black text-white mb-10 uppercase tracking-tight">Matriz Salarial ({profile.group})</h3><table className="w-full text-left min-w-[900px]"><thead><tr className="text-[10px] font-black text-slate-500 uppercase border-b border-slate-800"><th className="pb-4 px-4">Grupo</th><th className="pb-4 px-4 text-center">H. Ordinaria</th>{['HE', 'Noche', 'Plus Llamada', 'Retén L', 'Retén F'].map(h => <th key={h} className="pb-4 px-4 text-center">{h}</th>)}</tr></thead><tbody>{Object.entries(lM).filter(([g]) => g === profile.group).map(([g, rgs]) => Object.entries(rgs).filter(([r]) => r === (parseInt(profile.level) <= 9 ? "1-9" : "10-12")).map(([r, d]) => (<tr key={`${g}-${r}`} className="border-b border-slate-800/50 bg-white/5 hover:bg-white/10 transition-all"><td className="py-4 px-4"><span className="text-xs font-black block text-indigo-400">{g}</span><span className="text-[9px] font-bold text-slate-500 uppercase">Nivel {profile.level}</span></td><td className="py-2 px-2 text-center font-bold text-xs text-white/40">{(d.extra / 1.75).toFixed(6)}</td>{Object.entries(d).map(([f, v]) => (<td key={f} className="py-2 px-2"><input type="number" step="0.01" className="w-full bg-slate-800/50 p-2 rounded-xl text-center text-xs font-bold border outline-none text-indigo-400 border-indigo-900" value={v} onChange={e => { const nM = {...lM}; nM[g][r][f] = parseFloat(e.target.value) || 0; slM(nM); }} /></td>))}</tr>)))}</tbody></table></section>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [viewDate, setViewDate] = useState(new Date());
            const [shifts, setShifts] = useState({});
            const [annualPlan, setAnnualPlan] = useState({});
            const [userColors, setUserColors] = useState({});
            const [plannerCounters, setPlannerCounters] = useState(DEFAULT_PLANNER_COUNTERS);
            const [weeklyRotation, setWeeklyRotation] = useState({});
            const [profile, setProfile] = useState({ group: "G V", level: "7", kmCount: 46 });
            const [globalRates, setGlobalRates] = useState(DEFAULT_GLOBAL_CONST);
            const [salaryMatrix, setSalaryMatrix] = useState(DEFAULT_SALARY_DATA);
            const [selected, setSelected] = useState(null);
            const [ui, setUi] = useState({ modal: false, settings: false, tab: 'calendar', error: '', info: '', colorPicker: null });
            const [authFields, setAuthFields] = useState({ email: '', pass: '', mode: 'login' });
            const [isIncognito, setIsIncognito] = useState(false);
            const [activeTool, setActiveTool] = useState(null);

            const save = useCallback(async (data, path) => {
                if (!user) return;
                try { await setDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', path), { data, updatedAt: Date.now() }); } catch (e) { setUi(prev => ({ ...prev, error: 'Error de sincronización' })); }
            }, [user]);

            useEffect(() => {
                const unsubAuth = onAuthStateChanged(auth, (u) => { setUser(u); setLoading(false); if (!u) { setShifts({}); setAnnualPlan({}); setPlannerCounters(DEFAULT_PLANNER_COUNTERS); setUserColors({}); setWeeklyRotation({}); setProfile({ group: "G V", level: "7", kmCount: 46 }); } });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubs = [
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'shifts'), snap => snap.exists() && setShifts(snap.data().data || {}), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'annual_plan'), snap => snap.exists() && setAnnualPlan(snap.data().data || {}), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'planner_counters'), snap => snap.exists() && setPlannerCounters(snap.data().data || DEFAULT_PLANNER_COUNTERS), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'weekly_rotation'), snap => snap.exists() && setWeeklyRotation(snap.data().data || {}), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'profile'), snap => snap.exists() && setProfile(p => ({ ...p, ...snap.data().data })), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'globalRates'), snap => snap.exists() && setGlobalRates(snap.data().data || DEFAULT_GLOBAL_CONST), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'salaryMatrix'), snap => snap.exists() && setSalaryMatrix(snap.data().data || DEFAULT_SALARY_DATA), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'userColors'), snap => snap.exists() && setUserColors(snap.data().data || {}), () => {})
                ];
                return () => unsubs.forEach(un => un());
            }, [user]);

            const rates = useMemo(() => {
                const g = salaryMatrix[profile.group] || salaryMatrix["G V"];
                const lvl = parseInt(profile.level) || 1;
                const range = lvl <= 9 ? "1-9" : "10-12";
                return g[range] || g["1-9"];
            }, [profile, salaryMatrix]);

            const calcDay = useCallback((dateStr, data, plan, allShifts) => {
                if (!data) return { total: 0, restHours: 0, items: [] };
                const pEntry = plan?.[dateStr];
                const conceptId = typeof pEntry === 'object' ? pEntry.concept : (pEntry && pEntry !== 'intensiva' && pEntry !== 'partida' ? pEntry : null);
                
                const isStaticFestive = conceptId === 'static_festivo';
                const plannerCounter = plannerCounters.find(c => `cnt_${c.id}` === conceptId);
                const isDynamicFestive = plannerCounter && (plannerCounter.desc.toUpperCase().includes("FIESTA") || plannerCounter.desc.toUpperCase().includes("FESTIVO"));
                const isPlannerFestive = isStaticFestive || isDynamicFestive;

                const d = new Date(dateStr);
                const isSunday = d.getDay() === 0;
                const isF = isSunday || d.getDay() === 6 || data.isFestive || isPlannerFestive; 
                const isFriday = d.getDay() === 5;
                
                const res = { total: 0, restHours: 0, items: [] };
                const add = (label, val, type, qty = 1) => { if (val > 0) { res.total += val; res.items.push({ label, value: val, type, qty }); } };
                
                if (isF && data.shift && data.shift !== 'D') {
                    const nextDay = new Date(d); nextDay.setDate(d.getDate() + 1);
                    const nextDayISO = toISO(nextDay); const nDayData = allShifts?.[nextDayISO];
                    if (!(nextDay.getDay() === 0 || nextDay.getDay() === 6 || nDayData?.isFestive)) {
                        const nextDayPlan = plan?.[nextDayISO];
                        const nextDayBase = typeof nextDayPlan === 'object' ? nextDayPlan?.base : nextDayPlan;
                        const restAmount = nextDayBase === 'intensiva' ? 7.5 : nextDayBase === 'partida' ? 8.5 : 8;
                        res.restHours += restAmount; res.items.push({ label: isSunday ? `Descanso Domingo (${restAmount}h)` : `Descanso Festivo (${restAmount}h)`, value: restAmount, type: 'coffee', qty: restAmount });
                    }
                }

                if (data.isReten) add(`Retén ${isF ? 'F' : 'L'}`, isF ? rates.r_f : rates.r_l, 'reten', 1);
                
                const concepts = data.activeConceptsCount || {};
                const tKm = (parseFloat(concepts['comp_km']) || 0) * (profile.kmCount || 0) + (parseFloat(data.extraKm) || 0);
                if (tKm > 0) add(`Kilometraje (${tKm}km)`, tKm * globalRates.KM_PRICE, 'km', tKm);
                
                Object.entries(concepts).forEach(([id, count]) => {
                    if (count <= 0 || id === 'comp_km') return;
                    if ((data.shift === 'R7' || data.shift === 'R9') && ['plus_llamada', 'comp_llamada'].includes(id) && !isF) return;
                    if (id === 'trc') { let m = data.shift === 'R7' ? 1.5 : data.shift === 'R9' ? 2.5 : data.shift === 'S5' ? (isF ? 3 : 2) : (['S1', 'S3'].includes(data.shift) ? (isF ? 2 : 1) : 1); add(`Plus TRC ${m}x (x${count})`, (globalRates.TRC * m) * count, 'trc', m * count); }
                    if (id === 'tra') add(`Plus TRA ${isF ? 3 : 2}x (x${count})`, (globalRates.TRA * (isF ? 3 : 2)) * count, 'tra', count);
                    if (id === 'plus_llamada') add(`Plus Llamada (x${count})`, rates.call * count, 'call_plus', count);
                    if (id === 'comp_llamada' && !data.isReten) add(`Comp. Llamada (x${count})`, (isF ? globalRates.CALL_F : globalRates.CALL_L) * count, 'call_comp', count);
                    if (id === 'comida') add(`Ayuda Comida (x${count})`, globalRates.FOOD * count, 'food', count);
                    if (id === 'otros' && parseFloat(data.otrosValue) > 0) add(data.otrosLabel || 'Otros', parseFloat(data.otrosValue) * count, 'custom', count);
                });

                if (data.shift === 'P1') add(`Plus P1 ${isFriday ? '(Viernes)' : ''}`, isFriday ? globalRates.P1_FRI : globalRates.P1_BASE, 'p1', 1);
                
                if (data.shift && data.shift !== 'D') {
                    const h = parseFloat(data.extras) || 0;
                    if (h > 0) {
                        const isNf = isF || (parseFloat(data.horasNocturnas) > 0);
                        if (data.extraCompMode === 'mixed') { 
                            res.restHours += h; 
                            res.items.push({ label: `Descanso HE (1x)`, value: h, type: 'coffee', qty: h }); 
                            // Actualización Lógica: 0.75 sobre el valor de la hora ordinaria (extra / 1.75)
                            add(`HE Cobro (0.75x)`, h * (rates.extra / 1.75) * 0.75, 'he', h); 
                        }
                        else if (data.extraCompMode === 'rest_total') { const mult = isNf ? 2 : 1.75; res.restHours += h * mult; res.items.push({ label: `Descanso HE (${mult}x)`, value: h * mult, type: 'coffee', qty: h * mult }); }
                        else add(`HE Cobro 100%`, h * rates.extra, 'he', h);
                    }
                    if (parseFloat(data.horasNocturnas) > 0) add(`Nocturnidad ${data.horasNocturnas}h`, parseFloat(data.horasNocturnas) * rates.night, 'night', parseFloat(data.horasNocturnas));
                }
                return res;
            }, [rates, globalRates, profile.kmCount, plannerCounters]);

            const stats = useMemo(() => {
                const init = () => ({ val: 0, count: 0 });
                const s = { month: { total: 0, trc: init(), tra: init(), call_plus: init(), call_comp: init(), food: init(), km: init(), he: init(), night: init(), reten: init(), restHours: 0, custom: init(), p1: init() } };
                Object.entries(shifts).forEach(([ds, data]) => {
                    const c = calcDay(ds, data, annualPlan, shifts);
                    const [y, m] = ds.split('-').map(Number);
                    if (y === viewDate.getFullYear() && m === (viewDate.getMonth() + 1)) {
                        s.month.total += c.total; s.month.restHours += c.restHours;
                        c.items.forEach(i => { if (s.month[i.type]) { s.month[i.type].val += i.value; s.month[i.type].count += (i.qty || 1); } });
                    }
                });

                                        <section className="bg-blue-50/50 p-8 rounded-[40px] border-2 border-blue-100 animate-in">
                                            <div className="flex items-center gap-3 mb-6"><Icon name="map" size={18} className="text-blue-600" /><h4 className="text-[11px] font-black uppercase text-blue-900 tracking-widest">KM EXTRA SUMABLES A BASE ({profile.kmCount}KM)</h4></div>
                                            <div className="flex items-center bg-white p-6 rounded-[28px] border-2 border-blue-100/50 shadow-sm"><input type="number" placeholder="Km" className="w-full bg-transparent text-3xl font-black text-slate-900 outline-none" value={selected.extraKm || ''} onChange={e => { const upd = {...selected, extraKm: e.target.value}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} /><span className="text-[10px] font-black text-blue-400 uppercase tracking-widest ml-4">KM</span></div>
                                        </section>
                                    )}
                                    {selected.activeConceptsCount?.['otros'] > 0 && (
                                        <section className="bg-slate-50/50 p-8 rounded-[40px] border-2 border-slate-200 animate-in">
                                            <div className="flex items-center gap-3 mb-6"><Icon name="plus" size={18} className="text-slate-600" /><h4 className="text-[11px] font-black uppercase text-slate-900 tracking-widest">DESGLOSE CONCEPTOS "OTROS"</h4></div>
                                            <div className="flex flex-col md:flex-row gap-4">
                                                <div className="flex-1 bg-white p-6 rounded-[28px] border-2 border-slate-100 shadow-sm"><input type="text" placeholder="Ej: Plus Pantalla" className="w-full bg-transparent text-lg font-bold text-slate-900 outline-none placeholder:text-slate-200" value={selected.otrosLabel || ''} onChange={e => { const upd = {...selected, otrosLabel: e.target.value}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} /></div>
                                                <div className="w-full md:w-32 bg-white p-6 rounded-[28px] border-2 border-slate-100 shadow-sm flex items-center"><input type="number" step="0.01" className="w-full bg-transparent text-lg font-black text-slate-900 outline-none text-center" value={selected.otrosValue || ''} onChange={e => { const upd = {...selected, otrosValue: e.target.value}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} /><span className="text-slate-300 font-bold ml-2">€</span></div>
                                            </div>
                                        </section>
                                    )}
                                    <div className="grid grid-cols-2 gap-6">
                                        <section><label className="text-[10px] font-black uppercase text-slate-400 block mb-2">Extras (H)</label><input type="number" step="0.5" className="w-full bg-slate-50 p-6 rounded-[28px] text-4xl font-black text-slate-900 border-2 border-slate-100 outline-none" value={selected.extras || 0} onChange={e => { const upd = {...selected, extras: parseFloat(e.target.value) || 0}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} /></section>
                                        <section><label className="text-[10px] font-black uppercase text-slate-400 block mb-2">Noche (H)</label><input type="number" step="0.5" className="w-full bg-slate-50 p-6 rounded-[28px] text-4xl font-black text-slate-900 border-2 border-slate-100 outline-none" value={selected.horasNocturnas || 0} onChange={e => { const upd = {...selected, horasNocturnas: parseFloat(e.target.value) || 0}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} /></section>
                                    </div>
                                    <section className="bg-indigo-50/50 p-8 rounded-[40px] border-2 border-indigo-100">
                                        <div className="flex items-center gap-3 mb-6"><Icon name="briefcase" size={18} className="text-indigo-600" /><h4 className="text-[11px] font-black uppercase text-indigo-900 tracking-widest">OPCIONES DE COMPENSACIÓN HORAS EXTRAS</h4></div>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            {[ { id: 'money', l: 'COBRAR 100%', d: 'Abono íntegro del valor de la hora extra.' }, { id: 'rest_total', l: 'COMPENSAR TOTAL', d: '2h descanso por cada hora (Fest/Noct)' }, { id: 'mixed', l: 'COBRAR + COMP.', d: '1h descanso + 0.75 del valor económico.' } ].map(opt => (
                                                <button key={opt.id} onClick={() => { const upd = {...selected, extraCompMode: opt.id}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} className={`p-5 rounded-3xl text-left border-2 transition-all ${selected.extraCompMode === opt.id || (!selected.extraCompMode && opt.id === 'money') ? 'bg-indigo-600 border-indigo-600 shadow-xl' : 'bg-white border-white hover:border-indigo-100'}`}><p className={`text-[10px] font-black mb-1 ${selected.extraCompMode === opt.id || (!selected.extraCompMode && opt.id === 'money') ? 'text-white' : 'text-indigo-600'}`}>{opt.l}</p><p className={`text-[8px] font-bold leading-tight ${selected.extraCompMode === opt.id || (!selected.extraCompMode && opt.id === 'money') ? 'text-indigo-100' : 'text-slate-400'}`}>{opt.d}</p></button>
                                            ))}
                                        </div>
                                    </section>
                                </div>
                                <div className="p-8 bg-slate-50 border-t border-slate-100 flex justify-end gap-3"><button onClick={() => { const ns = {...shifts}; delete ns[selected.ds]; setShifts(ns); save(ns, 'shifts'); setUi({...ui, modal: false}); }} className="px-8 py-4 bg-red-50 text-red-500 font-black rounded-3xl uppercase text-[10px] tracking-widest hover:bg-red-100">Borrar</button><button onClick={() => setUi({...ui, modal: false})} className="px-12 py-4 bg-[#111827] text-white font-black rounded-3xl uppercase text-[10px] shadow-lg active:scale-95">Listo</button></div>
                            </div>
                        </div>
                    )}
                    {ui.settings && <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in"><div className="bg-white w-full max-lg rounded-[48px] shadow-2xl p-10 relative border border-white/20"><button onClick={() => setUi({...ui, settings: false})} className="absolute top-8 right-8 p-3 bg-slate-50 rounded-2xl hover:bg-slate-100 transition-all"><Icon name="x" size={24} /></button><h3 className="text-2xl font-black mb-10">Ajustes Perfil</h3><div className="space-y-8"><section><label className="text-[10px] font-black uppercase text-slate-400 block mb-4">Grupo Profesional</label><div className="grid grid-cols-4 gap-2">{Object.keys(salaryMatrix).map(g => (<button key={g} onClick={() => { const np = {...profile, group: g}; setProfile(np); save(np, 'profile'); }} className={`py-4 rounded-2xl font-black text-xs border-2 ${profile.group === g ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-100 text-slate-400'}`}>{g}</button>))}</div></section><section><label className="text-[10px] font-black uppercase text-slate-400 block mb-4">Nivel Salarial</label><div className="grid grid-cols-6 gap-2">{[...Array(12)].map((_, i) => (<button key={i+1} onClick={() => { const np = {...profile, level: String(i+1)}; setProfile(np); save(np, 'profile'); }} className={`py-3 rounded-xl font-black text-[10px] border-2 ${profile.level === String(i+1) ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-100 text-slate-400'}`}>{i+1}</button>))}</div></section><section><label className="text-[10px] font-black uppercase text-slate-400 block mb-4">Km ida + vuelta (Base)</label><input type="number" className="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 text-2xl font-black text-slate-800 outline-none" value={profile.kmCount} onChange={e => { const np = {...profile, kmCount: parseFloat(e.target.value) || 0}; setProfile(np); save(np, 'profile'); }} /></section></div><button onClick={() => setUi({...ui, settings: false})} className="w-full mt-10 py-5 bg-slate-900 text-white font-black rounded-3xl uppercase text-xs shadow-xl active:scale-95">Listo</button></div></div>}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
