<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANAV ShiftExpert v16.2 - Optimización de Datos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useCallback, memo } = React;

        // --- FIREBASE INFRASTRUCTURE ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDaAn2WUiHDnIRU5SZ9sogOsICUcvG1DSI",
            authDomain: "notasdegasto-12d33.firebaseapp.com",
            projectId: "notasdegasto-12d33",
            storageBucket: "notasdegasto-12d33.firebasestorage.app",
            messagingSenderId: "979069209782",
            appId: "1:979069209782:web:1d7ccd86e6b9f390caea17"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = 'anav-shift-calc-v5';

        // --- CONSTANTS ---
        const DEFAULT_SALARY_DATA = {
            "G I": { "1-9": { extra: 106.34, night: 8.75, call: 134.98, r_l: 62.47, r_f: 108.35 }, "10-12": { extra: 119.26, night: 9.80, call: 147.54, r_l: 64.31, r_f: 115.20 } },
            "G II": { "1-9": { extra: 84.49, night: 6.95, call: 113.97, r_l: 59.86, r_f: 102.15 }, "10-12": { extra: 94.79, night: 7.80, call: 123.86, r_l: 60.80, r_f: 108.40 } },
            "G III": { "1-9": { extra: 69.90, night: 5.75, call: 98.81, r_l: 58.07, r_f: 98.60 }, "10-12": { extra: 75.34, night: 6.20, call: 105.42, r_l: 59.86, r_f: 102.30 } },
            "G IV": { "1-9": { extra: 58.31, night: 4.80, call: 85.12, r_l: 57.23, r_f: 95.10 }, "10-12": { extra: 63.82, night: 5.25, call: 92.45, r_l: 57.23, r_f: 95.10 } },
            "G V": { "1-9": { extra: 49.79, night: 4.11, call: 74.64, r_l: 55.48, r_f: 92.15 }, "10-12": { extra: 49.79, night: 4.11, call: 74.64, r_l: 55.48, r_f: 92.15 } },
            "G VI": { "1-9": { extra: 43.12, night: 3.55, call: 68.20, r_l: 53.10, r_f: 88.40 }, "10-12": { extra: 43.12, night: 3.55, call: 68.20, r_l: 53.10, r_f: 88.40 } },
            "G VII": { "1-9": { extra: 38.50, night: 3.15, call: 62.15, r_l: 51.20, r_f: 85.00 }, "10-12": { extra: 38.50, night: 3.15, call: 62.15, r_l: 51.20, r_f: 85.00 } }
        };

        const DEFAULT_GLOBAL_CONST = { 
            TRC: 55.01, TRA: 20.90, CALL_L: 54.47, CALL_F: 98.35, FOOD: 40.69, KM_PRICE: 0.55, P1_BASE: 32.90, P1_FRI: 46.74
        };

        const GLOBAL_LABELS = {
            TRC: "Plus TRC", TRA: "Plus TRA", CALL_L: "Comp. Llamada (Laboral)", CALL_F: "Comp. Llamada (Festivo)", FOOD: "Ayuda Comida", KM_PRICE: "Precio Kilometraje", P1_BASE: "Plus P1 (Lun-Jue)", P1_FRI: "Plus P1 (Viernes)"
        };

        const SHIFTS = [
            { id: 'D', color: 'bg-green-600 text-white', desc: 'Descanso / Vacaciones', time: '-' },
            { id: 'P1', color: 'bg-slate-200 text-slate-700', desc: 'Jornada Partida', time: '07:00 a 16:30' },
            { id: 'I7', color: 'bg-slate-200 text-slate-700', desc: 'I7 Abierto Mañana / Tarde', time: '-' },
            { id: 'R1', color: 'bg-yellow-100 text-yellow-800', desc: 'Abierto Recarga Mañana', time: '06:00 a 14:30' },
            { id: 'R3', color: 'bg-yellow-200 text-yellow-900', desc: 'Abierto Recarga Tarde', time: '14:00 a 22:30' },
            { id: 'R7', color: 'bg-pink-100 text-pink-800', desc: 'R7 TRC 12h', time: '07:00 a 19:00' },
            { id: 'R9', color: 'bg-blue-100 text-blue-800', desc: 'R9 TRC 12h', time: '19:00 a 07:00' },
            { id: 'S1', color: 'bg-orange-100 text-orange-800', desc: 'Cerrado Recarga Mañana', time: '06:00 a 14:00' },
            { id: 'S3', color: 'bg-green-100 text-green-800', desc: 'Cerrado Recarga Tarde', time: '14:00 a 22:00' },
            { id: 'S5', color: 'bg-purple-100 text-purple-800', desc: 'Cerrado Recarga Noche', time: '22:00 a 06:00' },
        ];

        // --- HELPERS ---
        const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        
        const formatMoney = (val) => val.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        const Icon = memo(({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <span className={`inline-flex items-center justify-center ${className}`}><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        });

        const App = () => {
            // -- State --
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [viewDate, setViewDate] = useState(new Date());
            const [shifts, setShifts] = useState({});
            const [profile, setProfile] = useState({ group: "G V", level: "7", kmCount: 46 });
            const [globalRates, setGlobalRates] = useState(DEFAULT_GLOBAL_CONST);
            const [salaryMatrix, setSalaryMatrix] = useState(DEFAULT_SALARY_DATA);
            const [selected, setSelected] = useState(null);
            const [ui, setUi] = useState({ modal: false, settings: false, tab: 'calendar', error: '' });
            const [authFields, setAuthFields] = useState({ email: '', pass: '', mode: 'login' });
            const [isIncognito, setIsIncognito] = useState(false);

            // -- Firebase Actions --
            const save = useCallback(async (data, path) => {
                if (!user) return;
                try {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', path), { 
                        data, 
                        updatedAt: Date.now() 
                    });
                } catch (e) { 
                    setUi(prev => ({ ...prev, error: 'Error de sincronización' })); 
                }
            }, [user]);

            useEffect(() => {
                const unsubAuth = onAuthStateChanged(auth, (u) => { 
                    setUser(u); setLoading(false); 
                    if (!u) { 
                        setShifts({}); 
                        setProfile({ group: "G V", level: "7", kmCount: 46 }); 
                    }
                });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubShifts = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'shifts'), snap => {
                    if(snap.exists()) setShifts(snap.data().data || {});
                });
                const unsubProfile = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'profile'), snap => {
                    if(snap.exists()) setProfile(p => ({ ...p, ...snap.data().data }));
                });
                const unsubGlobalRates = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'globalRates'), snap => {
                    if(snap.exists()) setGlobalRates(snap.data().data || DEFAULT_GLOBAL_CONST);
                });
                const unsubSalaryMatrix = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'salaryMatrix'), snap => {
                    if(snap.exists()) setSalaryMatrix(snap.data().data || DEFAULT_SALARY_DATA);
                });
                return () => { unsubShifts(); unsubProfile(); unsubGlobalRates(); unsubSalaryMatrix(); };
            }, [user]);

            // -- Format Logic --
            const displayValue = useCallback((val, unit = '€', forceShow = false) => {
                if (isIncognito && !forceShow) return 'xxx' + unit;
                return (typeof val === 'number' ? formatMoney(val) : val) + unit;
            }, [isIncognito]);

            // -- Calculation Logic --
            const rates = useMemo(() => {
                const g = salaryMatrix[profile.group] || salaryMatrix["G V"];
                const lvl = parseInt(profile.level) || 1;
                return g[lvl <= 9 ? "1-9" : "10-12"];
            }, [profile, salaryMatrix]);

            const calcDay = useCallback((dateStr, data) => {
                if (!data) return { total: 0, restHours: 0, items: [] };
                const d = new Date(dateStr);
                const isSun = d.getDay() === 0;
                const isF = isSun || d.getDay() === 6 || data.isFestive;
                const isFri = d.getDay() === 5;
                const res = { total: 0, restHours: 0, items: [] };
                
                const add = (label, val, type, qty = 1) => {
                    const v = parseFloat(val) || 0;
                    if (v > 0) { 
                        res.total = Math.round((res.total + v) * 100) / 100;
                        res.items.push({ label, value: v, type, qty }); 
                    }
                };

                if (isSun && data.shift && data.shift !== 'D') {
                    res.restHours += 8;
                    res.items.push({ label: "Descanso Domingo", value: 8, type: 'coffee', qty: 8 });
                }

                if (data.isReten) {
                    add(`Retén ${isF ? 'F' : 'L'}`, isF ? rates.r_f : rates.r_l, 'reten', 1);
                }
                
                const concepts = data.activeConceptsCount || {};
                Object.entries(concepts).forEach(([id, count]) => {
                    const cCount = parseInt(count) || 0;
                    if (cCount <= 0) return;

                    const isRestrictedShift = (data.shift === 'R7' || data.shift === 'R9');

                    if (id === 'comp_km') {
                        const pertocaBase = !(isRestrictedShift && !isF);
                        const bKm = pertocaBase ? cCount * (parseFloat(profile.kmCount) || 0) : 0;
                        if (bKm > 0) add(`Kilometraje (${bKm}km)`, bKm * globalRates.KM_PRICE, 'km', bKm);
                        return;
                    }

                    if (isRestrictedShift && ['plus_llamada', 'comp_llamada'].includes(id) && !isF) return;

                    if (id === 'trc') {
                        const m = { 'R7': 1.5, 'R9': 2.5, 'S5': isF ? 3 : 2, 'S1': isF ? 2 : 1, 'S3': isF ? 2 : 1 }[data.shift] || 1;
                        add(`Plus TRC ${m}x (x${cCount})`, (globalRates.TRC * m) * cCount, 'trc', cCount);
                    }

                    if (id === 'tra') add(`Plus TRA ${isF ? 3 : 2}x (x${cCount})`, (globalRates.TRA * (isF ? 3 : 2)) * cCount, 'tra', cCount);
                    if (id === 'plus_llamada') add(`Plus Llamada (x${cCount})`, rates.call * cCount, 'call_plus', cCount);
                    if (id === 'comp_llamada' && !data.isReten) add(`Comp. Llamada (x${cCount})`, (isF ? globalRates.CALL_F : globalRates.CALL_L) * cCount, 'call_comp', cCount);
                    if (id === 'comida') add(`Ayuda Comida (x${cCount})`, globalRates.FOOD * cCount, 'food', cCount);
                });

                if (data.manualEntries) {
                    data.manualEntries.forEach(e => e.value > 0 && add(e.label || 'Otros', e.value, 'custom', 1));
                }

                if (data.shift === 'P1') {
                    add(`Plus P1 ${isFri ? '(Viernes)' : ''}`, isFri ? globalRates.P1_FRI : globalRates.P1_BASE, 'p1', 1);
                }

                if (data.shift && data.shift !== 'D') {
                    const h = parseFloat(data.extras) || 0;
                    if (h > 0) {
                        const isNf = isF || (parseFloat(data.horasNocturnas) > 0);
                        const mode = data.extraCompMode || 'money';
                        if (mode === 'mixed') {
                            res.restHours += h; res.items.push({ label: `Descanso HE (1x)`, value: h, type: 'coffee', qty: h });
                            add(`HE Cobro (0.75x)`, h * rates.extra * 0.75, 'he', h);
                        } else if (mode === 'rest_total') {
                            const mult = isNf ? 2 : 1.75; res.restHours += h * mult;
                            res.items.push({ label: `Descanso HE (${mult}x)`, value: h * mult, type: 'coffee', qty: h * mult });
                        } else {
                            add(`HE Cobro 100%`, h * rates.extra, 'he', h);
                        }
                    }
                    const n = parseFloat(data.horasNocturnas) || 0;
                    if (n > 0) add(`Nocturnidad ${n}h`, n * rates.night, 'night', n);
                }
                return res;
            }, [rates, globalRates, profile.kmCount]);

            const stats = useMemo(() => {
                const init = () => ({ val: 0, count: 0 });
                const s = { 
                    month: { 
                        total: 0, trc: init(), tra: init(), call_plus: init(), 
                        call_comp: init(), food: init(), km: init(), he: init(), 
                        night: init(), reten: init(), restHours: 0, custom: init(), p1: init() 
                    } 
                };
                Object.entries(shifts).forEach(([ds, data]) => {
                    const [y, m] = ds.split('-').map(Number);
                    if (y === viewDate.getFullYear() && m === (viewDate.getMonth() + 1)) {
                        const c = calcDay(ds, data);
                        s.month.total = Math.round((s.month.total + c.total) * 100) / 100;
                        s.month.restHours += c.restHours;
                        c.items.forEach(i => { 
                            if (s.month[i.type]) { 
                                s.month[i.type].val = Math.round((s.month[i.type].val + i.value) * 100) / 100;
                                s.month[i.type].count += (i.qty || 1); 
                            } 
                        });
                    }
                });
                return s;
            }, [shifts, viewDate, calcDay]);

            // -- Render Parts --
            const PieChartComp = ({ data }) => {
                const total = data.reduce((acc, item) => acc + (item.value || 0), 0);
                let cumulativeAngle = 0;
                if (total <= 0) return <div className="h-64 bg-slate-50 rounded-full border-2 border-dashed flex items-center justify-center text-[10px] font-black text-slate-300">SIN DATOS</div>;
                return (
                    <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90">
                        {data.map((item, index) => {
                            if (item.value <= 0) return null;
                            const angle = (item.value / total) * 360;
                            const x1 = 50 + 40 * Math.cos((Math.PI * cumulativeAngle) / 180);
                            const y1 = 50 + 40 * Math.sin((Math.PI * cumulativeAngle) / 180);
                            cumulativeAngle += angle;
                            const x2 = 50 + 40 * Math.cos((Math.PI * cumulativeAngle) / 180);
                            const y2 = 50 + 40 * Math.sin((Math.PI * cumulativeAngle) / 180);
                            return <path key={index} d={`M 50 50 L ${x1} ${y1} A 40 40 0 ${angle > 180 ? 1 : 0} 1 ${x2} ${y2} Z`} fill={item.color} />;
                        })}
                        <circle cx="50" cy="50" r="22" fill="white" />
                    </svg>
                );
            };

            // -- Auth View --
            if (loading) return <div className="min-h-screen bg-slate-900 flex items-center justify-center"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>;
            if (!user) return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6">
                    <div className="bg-slate-900 w-full max-sm rounded-[40px] shadow-2xl p-10 border border-slate-800 animate-in text-center">
                        <Icon name="calendar" size={40} className="text-indigo-500 mb-4" />
                        <h1 className="text-2xl font-black text-white uppercase mb-10">ShiftExpert</h1>
                        <form onSubmit={handleAuth} className="space-y-4">
                            <input type="email" required className="w-full bg-slate-800 p-4 rounded-2xl text-white text-sm" placeholder="Email" value={authFields.email} onChange={e => setAuthFields({...authFields, email: e.target.value})} />
                            <input type="password" required className="w-full bg-slate-800 p-4 rounded-2xl text-white text-sm" placeholder="Password" value={authFields.pass} onChange={e => setAuthFields({...authFields, pass: e.target.value})} />
                            <button type="submit" className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl uppercase text-xs tracking-widest">{authFields.mode === 'login' ? 'Entrar' : 'Registrarse'}</button>
                            <button type="button" onClick={() => setAuthFields({...authFields, mode: authFields.mode === 'login' ? 'register' : 'login'})} className="w-full text-[10px] font-black text-slate-500 uppercase tracking-widest mt-2">{authFields.mode === 'login' ? 'Crear Cuenta' : 'Ya tengo cuenta'}</button>
                            {ui.error && <p className="text-red-400 text-[10px] font-black mt-2">{ui.error}</p>}
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 pb-20">
                    <header className="w-full bg-slate-900 text-slate-400 py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest shadow-md">
                        <div className="flex items-center gap-2"><Icon name="user" size={12} className="text-indigo-500" /><span className="text-white">{user.email}</span></div>
                        <div className="hidden md:block italic opacity-50">ANAV ShiftExpert v16.2</div>
                    </header>

                    <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-5">
                                <div className="bg-indigo-600 p-5 rounded-3xl text-white shadow-xl rotate-3"><Icon name="calendar" size={28} /></div>
                                <div><h2 className="text-2xl font-black text-slate-900 tracking-tight">ShiftExpert v16.2</h2><p className="text-[10px] font-black uppercase text-indigo-500 tracking-widest">Calculadora de Jornada</p></div>
                            </div>
                            <nav className="flex bg-white p-1.5 rounded-[24px] shadow-lg border border-slate-100 items-center">
                                <button onClick={() => setIsIncognito(!isIncognito)} className={`px-4 py-3 rounded-2xl flex items-center gap-2 transition-all mr-1 ${isIncognito ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-indigo-600'}`}><Icon name={isIncognito ? "eye-off" : "eye"} size={16} /><span className="text-[10px] font-black uppercase">{isIncognito ? 'ON' : 'INCÓGNITO'}</span></button>
                                {['calendar', 'stats', 'precios'].map(t => (<button key={t} onClick={() => setUi({...ui, tab: t})} className={`px-8 py-3 rounded-2xl text-[10px] font-black uppercase transition-all ${ui.tab === t ? 'bg-slate-900 text-white shadow-md scale-105' : 'text-slate-400 hover:text-slate-600'}`}>{t === 'precios' ? 'Precios' : t === 'stats' ? 'Balance' : 'Calendario'}</button>))}
                                <button onClick={() => setUi({...ui, settings: true})} className="px-4 py-3 text-indigo-400 hover:text-indigo-600"><Icon name="user-cog" size={18}/></button>
                                <button onClick={() => signOut(auth)} className="px-4 py-3 text-red-400 hover:text-red-600"><Icon name="log-out" size={18}/></button>
                            </nav>
                        </div>

                        {ui.tab === 'calendar' && (
                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-8 animate-in">
                                <div className="lg:col-span-3 bg-white shadow-2xl rounded-[48px] overflow-hidden border border-slate-100">
                                    <div className="flex justify-between items-center p-8 border-b border-slate-50">
                                        <button onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1))} className="p-4 bg-slate-50 rounded-3xl hover:bg-indigo-50 transition-all"><Icon name="chevron-left" size={24}/></button>
                                        <h3 className="text-xl font-black text-slate-800 capitalize">{viewDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}</h3>
                                        <button onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1))} className="p-4 bg-slate-50 rounded-3xl hover:bg-indigo-50 transition-all"><Icon name="chevron-right" size={24}/></button>
                                    </div>
                                    <div className="grid grid-cols-7 bg-slate-900 text-white py-4 text-center text-[9px] font-black uppercase opacity-90">{['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => <div key={d} className={d === 'Sáb' || d === 'Dom' ? 'text-red-400' : ''}>{d}</div>)}</div>
                                    <div className="grid grid-cols-7">
                                        {(() => {
                                            const y = viewDate.getFullYear(), m = viewDate.getMonth(), start = (new Date(y, m, 1).getDay() + 6) % 7, total = new Date(y, m + 1, 0).getDate(), cells = [];
                                            for(let i=0; i<start; i++) cells.push(<div key={`e-${i}`} className="h-32 md:h-52 bg-slate-50/20 border border-slate-50"></div>);
                                            for(let d=1; d<=total; d++) {
                                                const ds = toISO(new Date(y, m, d)), dt = shifts[ds], cl = calcDay(ds, dt), isV = (new Date(y, m, d).getDay() === 0 || new Date(y, m, d).getDay() === 6 || dt?.isFestive);
                                                cells.push(
                                                    <div key={d} onClick={() => { setSelected({ day: d, ds, ...dt }); setUi({...ui, modal: true}); }} className={`h-56 md:h-64 border border-slate-100 p-3 cursor-pointer transition-all hover:bg-indigo-50 flex flex-col ${isV ? 'bg-red-50/20' : 'bg-white'}`}>
                                                        <div className="flex justify-between items-start mb-2"><span className={`text-[12px] font-black ${isV ? 'text-red-400' : 'text-slate-300'}`}>{d}</span><div className="flex flex-col items-end gap-1">{cl.total > 0 && <span className="text-[10px] font-black text-green-700 bg-white px-2 py-1 rounded-xl shadow-sm border border-green-100">{displayValue(cl.total)}</span>}{cl.restHours > 0 && (<div className="flex items-center gap-1 text-blue-600 font-black text-[9px] bg-blue-50 px-2 py-1 rounded-lg shadow-sm border border-blue-100"><Icon name="coffee" size={10} /><span>{cl.restHours.toFixed(1)}h</span></div>)}</div></div>
                                                        <div className="space-y-1 overflow-y-auto no-scrollbar flex-1">
                                                            {dt?.isReten && <div className="text-[8px] bg-indigo-600 text-white font-black px-2 py-1 rounded-lg text-center uppercase tracking-tighter mb-1">Retén</div>}
                                                            {dt?.shift && <div className={`text-[9px] font-black text-center px-2 py-1 rounded-xl shadow-sm mb-2 ${SHIFTS.find(s => s.id === dt.shift)?.color || 'bg-slate-100'}`}>{dt.shift}</div>}
                                                            <div className="space-y-1">{cl.items.map((it, idx) => (<div key={idx} className={`flex justify-between text-[8px] font-bold border-b border-slate-50 pb-0.5 ${it.type === 'coffee' ? 'text-blue-600' : 'text-slate-500'}`}><span className="truncate pr-1">{it.label}</span><span className="shrink-0">{it.type === 'coffee' ? (it.value.toFixed(1) + 'h') : displayValue(it.value)}</span></div>))}</div>
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            return cells;
                                        })()}
                                    </div>
                                </div>
                                <aside className="space-y-6">
                                    <div className="bg-white p-8 rounded-[40px] shadow-2xl border border-slate-100">
                                        <h3 className="text-sm font-black uppercase text-slate-400 mb-8 flex items-center gap-2"><Icon name="bar-chart-3" className="text-indigo-600" /> Resumen Mes</h3>
                                        <div className="space-y-4">
                                            {[
                                                { l: 'Bruto Variable', v: stats.month.total, s: '€', c: 'text-2xl font-black text-slate-900', m: true },
                                                { l: 'Descanso Acumulado', v: stats.month.restHours, s: 'h', c: 'text-xl font-black text-blue-600' },
                                                { l: 'HE (Pago)', v: stats.month.he.val, s: '€', m: true },
                                                { l: 'Nocturnidad', v: stats.month.night.val, s: '€', m: true },
                                                { l: 'Plus TRC', v: stats.month.trc.val, s: '€', m: true },
                                                { l: 'Plus TRA', v: stats.month.tra.val, s: '€', m: true },
                                                { l: 'Plus Llamada', v: stats.month.call_plus.val, s: '€', m: true },
                                                { l: 'Comp. Llamada', v: stats.month.call_comp.val, s: '€', m: true },
                                                { l: 'Kilometraje', v: stats.month.km.val, s: '€', m: true },
                                                { l: 'Ayuda Comida', v: stats.month.food.val, s: '€', m: true },
                                                { l: 'Retén Total', v: stats.month.reten.val, s: '€', m: true },
                                                { l: 'Plus P1', v: stats.month.p1.val, s: '€', m: true },
                                                { l: 'Otros', v: stats.month.custom.val, s: '€', m: true }
                                            ].map(i => (i.v > 0 || i.l === 'Bruto Variable') ? (
                                                <div key={i.l} className="flex flex-col border-b border-slate-50 pb-2 last:border-0">
                                                    <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">{i.l}</span>
                                                    <span className={i.c || 'text-sm font-black text-slate-700'}>{displayValue(i.v, i.s)}</span>
                                                </div>
                                            ) : null)}
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 p-8 rounded-[40px] shadow-2xl overflow-hidden">
                                        <h3 className="text-[10px] font-black text-indigo-400 mb-6 uppercase tracking-[0.3em]">Leyenda Horarios</h3>
                                        <div className="space-y-4 max-h-[400px] overflow-y-auto no-scrollbar">
                                            {SHIFTS.map(s => (
                                                <div key={s.id} className="flex flex-col border-l-2 border-slate-800 pl-4 py-1">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className={`w-8 h-6 flex items-center justify-center rounded-lg text-[9px] font-black ${s.color}`}>{s.id}</span>
                                                        <span className="text-[10px] font-black text-white tracking-tight">{s.desc}</span>
                                                    </div>
                                                    <p className="text-[9px] font-bold text-slate-500 italic ml-10">{s.time}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </aside>
                            </div>
                        )}

                        {ui.tab === 'stats' && (
                            <div className="animate-in grid grid-cols-1 gap-12 p-12 bg-white shadow-2xl rounded-[60px] border border-slate-100">
                                <div className="flex flex-col items-center border-b border-slate-50 pb-8">
                                    <h2 className="text-[10px] font-black uppercase text-indigo-500 tracking-widest">Balance Detallado</h2>
                                    <h3 className="text-2xl font-black text-slate-800 capitalize">{viewDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}</h3>
                                </div>
                                <div className="flex flex-col md:flex-row justify-between gap-10">
                                    <div className="w-full max-w-md">
                                        <h3 className="text-sm font-black text-slate-400 mb-10 uppercase">Distribución Mensual</h3>
                                        <div className="w-64 h-64 mx-auto relative">
                                            <PieChartComp data={[
                                                { label: 'TRC', value: stats.month.trc.val, color: '#6366f1' }, 
                                                { label: 'TRA', value: stats.month.tra.val, color: '#f59e0b' }, 
                                                { label: 'HE', value: stats.month.he.val, color: '#8b5cf6' },
                                                { label: 'Retén', value: stats.month.reten.val, color: '#4f46e5' },
                                                { label: 'Otros', value: Math.max(0, stats.month.total - (stats.month.trc.val + stats.month.tra.val + stats.month.he.val + stats.month.reten.val)), color: '#cbd5e1' }
                                            ]} />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-12 gap-y-6 w-full">
                                        {[
                                            { label: 'Plus TRC', data: stats.month.trc, color: '#6366f1' }, 
                                            { label: 'Plus TRA', data: stats.month.tra, color: '#f59e0b' }, 
                                            { label: 'Plus Llamada', data: stats.month.call_plus, color: '#ef4444' }, 
                                            { label: 'Comp. Llamada', data: stats.month.call_comp, color: '#f43f5e' }, 
                                            { label: 'Ayuda Comida', data: stats.month.food, color: '#10b981' }, 
                                            { label: 'Kilometraje', data: stats.month.km, color: '#0ea5e9', unit: 'km' }, 
                                            { label: 'Horas Extras', data: stats.month.he, color: '#8b5cf6', unit: 'h' }, 
                                            { label: 'Nocturnidad', data: stats.month.night, color: '#334155', unit: 'h' }, 
                                            { label: 'Retén Total', data: stats.month.reten, color: '#4f46e5' }, 
                                            { label: 'Plus P1', data: stats.month.p1, color: '#94a3b8' }, 
                                            { label: 'Otros', data: stats.month.custom, color: '#cbd5e1' }
                                        ].map((i, idx) => (
                                            <div key={idx} className={`flex items-center justify-between p-4 rounded-3xl bg-slate-50 ${i.data.val > 0 ? 'opacity-100' : 'opacity-40 grayscale'}`}>
                                                <div className="flex items-center gap-4"><div className="w-4 h-4 rounded-full" style={{ backgroundColor: i.color }}></div><span className="text-[11px] font-black uppercase text-slate-500">{i.label}</span></div>
                                                <div className="flex items-baseline gap-2"><span className="text-[10px] font-bold text-indigo-400 bg-indigo-50 px-2 py-0.5 rounded-lg">(x{i.data.count.toLocaleString('es-ES', { maximumFractionDigits: 1 })}{i.unit || ''})</span><span className="text-sm font-black text-slate-900">{displayValue(i.data.val, '€')}</span></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        {ui.tab === 'precios' && <PriceConfigPage />}
                    </div>

                    {/* SETTINGS MODAL */}
                    {ui.settings && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in">
                            <div className="bg-white w-full max-w-lg rounded-[48px] shadow-2xl p-10 relative border border-white/20">
                                <button onClick={() => setUi({...ui, settings: false})} className="absolute top-8 right-8 p-3 bg-slate-50 rounded-2xl"><Icon name="x" size={24} /></button>
                                <h3 className="text-2xl font-black mb-10 flex items-center gap-3">Ajustes Perfil <Icon name="user" size={24} /></h3>
                                <div className="space-y-8">
                                    <section>
                                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-4">Grupo Profesional</label>
                                        <div className="grid grid-cols-4 gap-2">{Object.keys(salaryMatrix).map(g => (<button key={g} onClick={() => { const np = {...profile, group: g}; setProfile(np); save(np, 'profile'); }} className={`py-4 rounded-2xl font-black text-xs border-2 ${profile.group === g ? 'border-indigo-600 bg-indigo-50 text-indigo-700 shadow-md' : 'border-slate-100 text-slate-400'}`}>{g}</button>))}</div>
                                    </section>
                                    <section>
                                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-4">Nivel Salarial</label>
                                        <div className="grid grid-cols-6 gap-2">{[...Array(12)].map((_, i) => { const l = String(i + 1); return <button key={l} onClick={() => { const np = {...profile, level: l}; setProfile(np); save(np, 'profile'); }} className={`py-3 rounded-xl font-black text-[10px] border-2 ${profile.level === l ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-100 text-slate-400'}`}>{l}</button>; })}</div>
                                    </section>
                                    <section>
                                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-4 tracking-widest">Km ida + vuelta (Base)</label>
                                        <div className="relative">
                                            <input type="number" className="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 text-2xl font-black text-slate-800 outline-none" value={profile.kmCount} onChange={e => { const np = {...profile, kmCount: parseFloat(e.target.value) || 0}; setProfile(np); save(np, 'profile'); }} />
                                            <span className="absolute right-6 top-1/2 -translate-y-1/2 font-black text-slate-300 uppercase text-xs">Km</span>
                                        </div>
                                    </section>
                                </div>
                                <button onClick={() => setUi({...ui, settings: false})} className="w-full mt-10 py-5 bg-slate-900 text-white font-black rounded-3xl uppercase text-xs shadow-xl transition-all">Listo</button>
                            </div>
                        </div>
                    )}

                    {/* SHIFT EDITOR MODAL */}
                    {ui.modal && selected && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md animate-in">
                            <div className="bg-white w-full max-w-2xl rounded-[48px] shadow-2xl overflow-hidden border border-white/10">
                                <header className="bg-slate-900 p-8 text-white flex justify-between items-center">
                                    <div><p className="text-indigo-400 text-[10px] font-black uppercase mb-1">Editor de Jornada</p><h3 className="text-3xl font-black tracking-tighter">{new Date(selected.ds).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}</h3></div>
                                    <button onClick={() => setUi({...ui, modal: false})} className="p-3 bg-white/10 rounded-2xl hover:bg-white/20 transition-colors"><Icon name="x" size={24} /></button>
                                </header>
                                <div className="p-8 max-h-[70vh] overflow-y-auto no-scrollbar space-y-8">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <button onClick={() => { const upd = {...selected, isReten: !selected.isReten}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} className={`p-5 rounded-[28px] border-4 flex items-center justify-between ${selected.isReten ? 'border-indigo-600 bg-indigo-50 shadow-md' : 'border-slate-100 bg-slate-50 opacity-60'}`}><div className="flex items-center gap-4"><Icon name="shield-check" size={24} /><h4 className="font-bold">Retén</h4></div><div className={`w-8 h-8 rounded-full border-4 ${selected.isReten ? 'bg-indigo-600 border-indigo-200' : 'bg-white border-slate-200'}`}></div></button>
                                        <button onClick={() => { const upd = {...selected, isFestive: !selected.isFestive}; if (['R7', 'R9'].includes(upd.shift)) { upd.extras = upd.isFestive ? 12 : 3.5; } setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} className={`p-5 rounded-[28px] border-4 flex items-center justify-between ${selected.isFestive ? 'border-red-600 bg-red-50 shadow-md' : 'border-slate-100 bg-slate-50 opacity-60'}`}><div className="flex items-center gap-4"><Icon name="party-popper" size={24} /><h4 className="font-bold">Festivo</h4></div><div className={`w-8 h-8 rounded-full border-4 ${selected.isFestive ? 'bg-red-600 border-red-200' : 'bg-white border-slate-200'}`}></div></button>
                                    </div>
                                    <section>
                                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-4">Tipo de Turno</label>
                                        <div className="grid grid-cols-5 gap-2">
                                            {SHIFTS.map(s => (<button key={s.id} onClick={() => { 
                                                const d = new Date(selected.ds), f = d.getDay() === 0 || d.getDay() === 6 || selected.isFestive; 
                                                const n_auto = (s.id === 'S5' || s.id === 'R9') ? 8 : (s.id === 'R3') ? 0.5 : 0;
                                                const upd = { 
                                                    ...selected, shift: s.id, 
                                                    activeConceptsCount: (['R7', 'R9'].includes(s.id) ? (f ? {trc: 1, plus_llamada: 1, comp_llamada: 1, comida: 1, comp_km: 1} : {trc: 1, comida: 1}) : ['S1', 'S3', 'S5'].includes(s.id) ? {trc: 1} : ['R1', 'R3'].includes(s.id) ? {tra: 1} : {}), 
                                                    extras: (s.id === 'R7' || s.id === 'R9' ? (f ? 12 : 3.5) : 0), 
                                                    horasNocturnas: n_auto, mileageEntries: [] 
                                                }; 
                                                setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); 
                                            }} className={`py-3 rounded-xl border-2 font-black text-[10px] transition-all ${selected.shift === s.id ? 'border-indigo-600 bg-indigo-50 text-indigo-800 shadow-md' : 'border-slate-100 text-slate-400 hover:border-slate-200'}`}>{s.id}</button>))}
                                        </div>
                                    </section>
                                    
                                    <section>
                                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-4 tracking-widest">Conceptos Variables</label>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {[{ id: 'trc', l: 'Plus TRC', ic: 'activity' }, { id: 'tra', l: 'Plus TRA', ic: 'trending-up' }, { id: 'plus_llamada', l: 'Plus Llamada', ic: 'phone-incoming' }, { id: 'comp_llamada', l: 'Comp. Llamada', ic: 'phone-forwarded' }, { id: 'comida', l: 'Ayuda Comida', ic: 'utensils' }, { id: 'comp_km', l: 'Kilometraje', ic: 'map' }, { id: 'otros', l: 'OTROS', ic: 'plus-circle' }].map(c => { 
                                                const count = selected.activeConceptsCount?.[c.id] || 0; 
                                                const isFDay = new Date(selected.ds).getDay() === 0 || new Date(selected.ds).getDay() === 6 || selected.isFestive;
                                                const isRestrictedCall = (selected.isReten && c.id === 'comp_llamada') || ((selected.shift === 'R7' || selected.shift === 'R9') && ['plus_llamada', 'comp_llamada'].includes(c.id) && !isFDay);
                                                const hasButtons = c.id !== 'comp_km';
                                                return (
                                                    <div key={c.id} className={`flex flex-col bg-slate-50 p-4 rounded-3xl border-2 transition-all ${count > 0 ? 'border-indigo-200 bg-indigo-50/30 shadow-sm' : 'border-slate-100'} ${isRestrictedCall ? 'opacity-30 cursor-not-allowed' : ''}`}>
                                                        <div className="flex items-center justify-between">
                                                            <div className="flex items-center gap-3">
                                                                <Icon name={c.ic} size={18} className={count > 0 ? 'text-indigo-600' : 'text-slate-400'} />
                                                                <span className={`text-[10px] font-black uppercase ${count > 0 ? 'text-indigo-900' : 'text-slate-500'}`}>{c.l}</span>
                                                            </div>
                                                            {hasButtons ? (
                                                                <div className="flex items-center bg-white rounded-2xl shadow-sm p-1">
                                                                    <button disabled={isRestrictedCall} onClick={() => { 
                                                                        const nCount = Math.max(0, count - 1);
                                                                        let mE = [...(selected.manualEntries || [])]; if (c.id === 'otros' && mE.length > 0) mE.pop(); 
                                                                        const upd = {...selected, manualEntries: mE, activeConceptsCount: {...selected.activeConceptsCount, [c.id]: nCount}}; 
                                                                        setSelected(upd); 
                                                                        const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); 
                                                                    }} className="w-8 h-8 text-slate-400 hover:text-red-500 transition-colors">-</button>
                                                                    <span className="w-8 text-center font-black text-xs text-indigo-600">{count}</span>
                                                                    <button disabled={isRestrictedCall} onClick={() => { 
                                                                        const nCount = count + 1;
                                                                        let mE = [...(selected.manualEntries || [])]; if (c.id === 'otros') mE.push({ label: '', value: 0 }); 
                                                                        const upd = {...selected, manualEntries: mE, activeConceptsCount: {...selected.activeConceptsCount, [c.id]: nCount}}; 
                                                                        setSelected(upd); 
                                                                        const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); 
                                                                    }} className="w-8 h-8 text-slate-400 hover:text-indigo-600 transition-colors">+</button>
                                                                </div>
                                                            ) : (
                                                                <div className="px-3 py-1 bg-white rounded-xl shadow-sm"><span className="text-[10px] font-black text-indigo-600 uppercase">{count > 0 ? 'AUTO' : 'OFF'}</span></div>
                                                            )}
                                                        </div>
                                                    </div>
                                                ); 
                                            })}
                                        </div>
                                    </section>
                                    
                                    {(selected.activeConceptsCount?.otros > 0 && selected.manualEntries?.length > 0) && (
                                        <section className="bg-indigo-50/50 p-6 rounded-[32px] border-2 border-indigo-100 space-y-4 animate-in">
                                            <label className="text-[10px] font-black uppercase text-indigo-600 flex items-center gap-2"><Icon name="edit-3" size={14}/> Desglose "Otros"</label>
                                            {selected.manualEntries.map((en, idx) => (
                                                <div key={idx} className="flex gap-3">
                                                    <input type="text" className="flex-1 bg-white p-3 rounded-xl border border-indigo-100 text-xs font-bold outline-none" placeholder="Concepto" value={en.label} onChange={e => { const nE = [...selected.manualEntries]; nE[idx].label = e.target.value; const u = {...selected, manualEntries: nE}; setSelected(u); const ns = {...shifts, [u.ds]: u}; setShifts(ns); save(ns, 'shifts'); }} />
                                                    <div className="relative w-28"><input type="number" className="w-full bg-white p-3 rounded-xl border border-indigo-100 text-xs font-black pr-6 text-right outline-none" value={en.value || ''} onChange={e => { const nE = [...selected.manualEntries]; nE[idx].value = parseFloat(e.target.value) || 0; const u = {...selected, manualEntries: nE}; setSelected(u); const ns = {...shifts, [u.ds]: u}; setShifts(ns); save(ns, 'shifts'); }} /><span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-300 font-bold">€</span></div>
                                                </div>
                                            ))}
                                        </section>
                                    )}

                                    <section className="space-y-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-2"><label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Horas Extras</label><input type="number" step="0.5" className="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 text-3xl font-black text-slate-800 outline-none" value={selected.extras || 0} onChange={e => { const v = parseFloat(e.target.value) || 0; const upd = {...selected, extras: v}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} /></div>
                                            <div className="space-y-2"><label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Nocturnidad</label><input type="number" step="0.5" className="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 text-3xl font-black text-slate-800 outline-none" value={selected.horasNocturnas || 0} onChange={e => { const v = parseFloat(e.target.value) || 0; const upd = {...selected, horasNocturnas: v}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} /></div>
                                        </div>
                                        {(parseFloat(selected.extras) > 0) && (
                                            <div className="bg-indigo-50 p-6 rounded-[32px] border-2 border-indigo-200 animate-in space-y-4">
                                                <div className="flex items-center gap-2 mb-2"><Icon name="hand-coins" className="text-indigo-600" size={18} /><label className="text-[11px] font-black uppercase text-indigo-900 tracking-tight">Opciones de Compensación</label></div>
                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                    {['money', 'rest_total', 'mixed'].map(mode => (
                                                        <button key={mode} onClick={() => { const u = {...selected, extraCompMode: mode}; setSelected(u); const ns = {...shifts, [u.ds]: u}; setShifts(ns); save(ns, 'shifts'); }} className={`p-4 rounded-2xl border-2 text-left flex flex-col transition-all ${selected.extraCompMode === mode || (!selected.extraCompMode && mode === 'money') ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg' : 'bg-white border-slate-100 text-slate-500 hover:border-indigo-200'}`}>
                                                            <span className="text-[10px] font-black uppercase tracking-widest mb-1">{mode === 'money' ? 'Cobrar 100%' : mode === 'rest_total' ? 'Descanso' : 'Mixto'}</span>
                                                            <span className="text-[8px] font-bold opacity-80 leading-tight">
                                                                {mode === 'money' ? 'Económico.' : mode === 'rest_total' ? 'Compensación.' : 'Pago + Descanso.'}
                                                            </span>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </section>
                                </div>
                                <footer className="p-8 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
                                    <button onClick={() => { const ns = {...shifts}; delete ns[selected.ds]; setShifts(ns); save(ns, 'shifts'); setUi({...ui, modal: false}); }} className="px-6 py-4 bg-red-50 text-red-600 font-black rounded-2xl uppercase text-[10px] tracking-widest hover:bg-red-100 transition-colors">Borrar</button>
                                    <button onClick={() => setUi({...ui, modal: false})} className="px-10 py-4 bg-slate-900 text-white font-black rounded-2xl uppercase text-[10px] shadow-lg active:scale-95 transition-all">Listo</button>
                                </footer>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
