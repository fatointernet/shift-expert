<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANAV ShiftExpert v8.8 - Compensación Mixta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- FIREBASE INFRASTRUCTURE ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDaAn2WUiHDnIRU5SZ9sogOsICUcvG1DSI",
            authDomain: "notasdegasto-12d33.firebaseapp.com",
            projectId: "notasdegasto-12d33",
            storageBucket: "notasdegasto-12d33.firebasestorage.app",
            messagingSenderId: "979069209782",
            appId: "1:979069209782:web:1d7ccd86e6b9f390caea17"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = 'anav-shift-calc-v5';

        // --- DEFAULTS ---
        const DEFAULT_SALARY_DATA = {
            "G I": { "1-9": { extra: 106.34, night: 8.75, call: 134.98, r_l: 62.47, r_f: 108.35 }, "10-12": { extra: 119.26, night: 9.80, call: 147.54, r_l: 64.31, r_f: 115.20 } },
            "G II": { "1-9": { extra: 84.49, night: 6.95, call: 113.97, r_l: 59.86, r_f: 102.15 }, "10-12": { extra: 94.79, night: 7.80, call: 123.86, r_l: 60.80, r_f: 108.40 } },
            "G III": { "1-9": { extra: 69.90, night: 5.75, call: 98.81, r_l: 58.07, r_f: 98.60 }, "10-12": { extra: 75.34, night: 6.20, call: 105.42, r_l: 59.86, r_f: 102.30 } },
            "G IV": { "1-9": { extra: 58.31, night: 4.80, call: 85.12, r_l: 57.23, r_f: 95.10 }, "10-12": { extra: 63.82, night: 5.25, call: 92.45, r_l: 57.23, r_f: 95.10 } },
            "G V": { "1-9": { extra: 49.79, night: 4.11, call: 74.64, r_l: 55.48, r_f: 92.15 }, "10-12": { extra: 49.79, night: 4.11, call: 74.64, r_l: 55.48, r_f: 92.15 } },
            "G VI": { "1-9": { extra: 43.12, night: 3.55, call: 68.20, r_l: 53.10, r_f: 88.40 }, "10-12": { extra: 43.12, night: 3.55, call: 68.20, r_l: 53.10, r_f: 88.40 } },
            "G VII": { "1-9": { extra: 38.50, night: 3.15, call: 62.15, r_l: 51.20, r_f: 85.00 }, "10-12": { extra: 38.50, night: 3.15, call: 62.15, r_l: 51.20, r_f: 85.00 } }
        };

        const DEFAULT_GLOBAL_CONST = { 
            TRC: 55.01, 
            TRA: 20.90, 
            CALL_L: 54.47, 
            CALL_F: 98.35, 
            FOOD: 40.69, 
            KM_PRICE: 0.55,
            P1_BASE: 32.90,
            P1_FRI: 46.74
        };

        const GLOBAL_LABELS = {
            TRC: "Plus TRC",
            TRA: "Plus TRA",
            CALL_L: "Comp. Llamada (Laboral)",
            CALL_F: "Comp. Llamada (Festivo)",
            FOOD: "Ayuda Comida",
            KM_PRICE: "Precio Kilometraje",
            P1_BASE: "Plus P1 (Lun-Jue)",
            P1_FRI: "Plus P1 (Viernes)"
        };

        const SHIFTS = [
            { id: 'D', color: 'bg-green-600 text-white', desc: 'Descanso / Vacaciones', time: '-' },
            { id: 'P1', color: 'bg-slate-200 text-slate-700', desc: 'Jornada Partida', time: '07:00 a 16:30' },
            { id: 'I7', color: 'bg-slate-200 text-slate-700', desc: 'I7 Abierto Mañana / Tarde', time: '-' },
            { id: 'R1', color: 'bg-yellow-100 text-yellow-800', desc: 'Abierto Recarga Mañana', time: '06:00 a 14:30' },
            { id: 'R3', color: 'bg-yellow-200 text-yellow-900', desc: 'Abierto Recarga Tarde', time: '14:00 a 22:30' },
            { id: 'R7', color: 'bg-pink-100 text-pink-800', desc: 'R7 TRC 12h', time: '07:00 a 19:00' },
            { id: 'R9', color: 'bg-blue-100 text-blue-800', desc: 'R9 TRC 12h', time: '19:00 a 07:00' },
            { id: 'S1', color: 'bg-orange-100 text-orange-800', desc: 'Cerrado Recarga Mañana', time: '06:00 a 14:00' },
            { id: 'S3', color: 'bg-green-100 text-green-800', desc: 'Cerrado Recarga Tarde', time: '14:00 a 22:00' },
            { id: 'S5', color: 'bg-purple-100 text-purple-800', desc: 'Cerrado Recarga Noche', time: '22:00 a 06:00' },
        ];

        const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        const Icon = React.memo(({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <span className={`inline-flex items-center justify-center ${className}`}><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        });

        const PieChart = ({ data }) => {
            const total = useMemo(() => data.reduce((acc, item) => acc + item.value, 0), [data]);
            let cumulativeAngle = 0;
            if (total <= 0) return <div className="flex items-center justify-center h-64 bg-slate-100 rounded-full border-4 border-dashed border-slate-200"><p className="text-slate-400 font-bold uppercase text-[10px]">Sin Datos</p></div>;
            return (
                <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90">
                    {data.map((item, index) => {
                        if (item.value <= 0) return null;
                        const angle = (item.value / total) * 360;
                        const x1 = 50 + 40 * Math.cos((Math.PI * cumulativeAngle) / 180);
                        const y1 = 50 + 40 * Math.sin((Math.PI * cumulativeAngle) / 180);
                        cumulativeAngle += angle;
                        const x2 = 50 + 40 * Math.cos((Math.PI * cumulativeAngle) / 180);
                        const y2 = 50 + 40 * Math.sin((Math.PI * cumulativeAngle) / 180);
                        return <path key={index} d={`M 50 50 L ${x1} ${y1} A 40 40 0 ${angle > 180 ? 1 : 0} 1 ${x2} ${y2} Z`} fill={item.color} className="hover:brightness-90 transition-all cursor-pointer" />;
                    })}
                    <circle cx="50" cy="50" r="22" fill="white" />
                </svg>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [viewDate, setViewDate] = useState(new Date());
            const [shifts, setShifts] = useState({});
            const [profile, setProfile] = useState({ group: "G V", level: "7", kmCount: 46 });
            const [globalRates, setGlobalRates] = useState(DEFAULT_GLOBAL_CONST);
            const [salaryMatrix, setSalaryMatrix] = useState(DEFAULT_SALARY_DATA);
            const [selected, setSelected] = useState(null);
            const [ui, setUi] = useState({ modal: false, settings: false, tab: 'calendar', error: '' });
            const [authFields, setAuthFields] = useState({ email: '', pass: '', mode: 'login' });

            const save = useCallback(async (data, path) => {
                if (!user) return;
                try {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', path), { data, updatedAt: Date.now() });
                } catch (e) { setUi(prev => ({ ...prev, error: 'Error de sincronización' })); }
            }, [user]);

            useEffect(() => {
                const unsubAuth = onAuthStateChanged(auth, (u) => { setUser(u); setLoading(false); });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubShifts = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'shifts'), snap => snap.exists() && setShifts(snap.data().data || {}));
                const unsubProfile = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'profile'), snap => snap.exists() && setProfile(p => ({ ...p, ...snap.data().data })));
                const unsubGlobalRates = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'globalRates'), snap => snap.exists() && setGlobalRates(snap.data().data || DEFAULT_GLOBAL_CONST));
                const unsubSalaryMatrix = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'salaryMatrix'), snap => snap.exists() && setSalaryMatrix(snap.data().data || DEFAULT_SALARY_DATA));
                return () => { unsubShifts(); unsubProfile(); unsubGlobalRates(); unsubSalaryMatrix(); };
            }, [user]);

            const rates = useMemo(() => {
                const g = salaryMatrix[profile.group] || salaryMatrix["G V"];
                return g[parseInt(profile.level) <= 9 ? "1-9" : "10-12"];
            }, [profile, salaryMatrix]);

            const calcDay = useCallback((dateStr, data) => {
                if (!data) return { total: 0, restHours: 0, items: [] };
                const d = new Date(dateStr);
                const isSunday = d.getDay() === 0;
                const isF = isSunday || d.getDay() === 6 || data.isFestive;
                const isFriday = d.getDay() === 5;
                const res = { total: 0, restHours: 0, items: [] };
                const add = (label, val, type) => {
                    const v = parseFloat(val);
                    if (v > 0) { res.total += v; res.items.push({ label, value: v, type }); }
                };

                if (isSunday && data.shift && data.shift !== 'D') {
                    res.restHours += 8;
                    res.items.push({ label: "Descanso Domingo", value: 8, type: 'coffee' });
                }

                if (data.isReten) add(`Retén ${isF ? 'F' : 'L'}`, isF ? rates.r_f : rates.r_l, 'shield');
                
                const concepts = data.activeConceptsCount || {};
                Object.entries(concepts).forEach(([id, count]) => {
                    if (count <= 0) return;
                    const isR7R9 = data.shift === 'R7' || data.shift === 'R9';
                    const isRestricted = ['comp_km', 'plus_llamada', 'comp_llamada'].includes(id);
                    if (isR7R9 && isRestricted && !isF) return;

                    if (id === 'trc') {
                        const m = data.shift === 'R7' ? 1.5 : data.shift === 'R9' ? 2.5 : ['S3', 'S5'].includes(data.shift) ? (isF ? 3 : 2) : ['S1'].includes(data.shift) ? (isF ? 2 : 1) : 1;
                        add(`Plus TRC ${m}x (x${count})`, (globalRates.TRC * m) * count, 'trc');
                    }
                    if (id === 'tra') add(`Plus TRA ${isF ? 3 : 2}x (x${count})`, (globalRates.TRA * (isF ? 3 : 2)) * count, 'tra');
                    if (id === 'plus_llamada') add(`Plus Llamada (x${count})`, rates.call * count, 'phone');
                    if (id === 'comp_llamada' && !data.isReten) add(`Comp. Llamada (x${count})`, (isF ? globalRates.CALL_F : globalRates.CALL_L) * count, 'phone');
                    if (id === 'comida') add(`Ayuda Comida (x${count})`, globalRates.FOOD * count, 'food');
                    if (id === 'comp_km') {
                        const manualKm = (data.mileageEntries || []).reduce((acc, curr) => acc + (parseFloat(curr) || 0), 0);
                        const baseKm = count * (profile.kmCount || 0);
                        const totalKm = baseKm + manualKm;
                        if (totalKm > 0) add(`Kilometraje (${totalKm}km)`, totalKm * globalRates.KM_PRICE, 'map');
                    }
                });

                if (data.manualEntries && data.manualEntries.length > 0) {
                    data.manualEntries.forEach(entry => {
                        if (entry.value > 0) add(entry.label || 'Otro Concepto', entry.value, 'custom');
                    });
                }

                if (data.shift === 'P1') {
                    const p1Val = isFriday ? globalRates.P1_FRI : globalRates.P1_BASE;
                    add(`Plus P1 ${isFriday ? '(Viernes)' : ''}`, p1Val, 'p1_bonus');
                }

                if (data.shift && data.shift !== 'D') {
                    const h = parseFloat(data.extras) || 0;
                    if (h > 0) {
                        const isNightOrFestive = isF || (parseFloat(data.horasNocturnas) > 0);
                        const compMode = data.extraCompMode || 'money';
                        
                        if (compMode === 'mixed') {
                            res.restHours += h * 1;
                            res.items.push({ label: `Descanso HE (1x)`, value: h * 1, type: 'coffee' });
                            add(`HE Parte Pago (0.75x)`, h * rates.extra * 0.75, 'clock');
                        } else if (isNightOrFestive) {
                            if (compMode === 'rest_total') {
                                res.restHours += h * 2;
                                res.items.push({ label: `Descanso HE (2x)`, value: h * 2, type: 'coffee' });
                            }
                            else add(`Horas Extra (2.0)`, h * rates.extra, 'clock');
                        } else {
                            if (compMode === 'rest_total') {
                                res.restHours += h * 1.75;
                                res.items.push({ label: `Descanso HE (1.75x)`, value: h * 1.75, type: 'coffee' });
                            }
                            else add(`Horas Extra (Laboral)`, h * rates.extra, 'clock');
                        }
                    }
                    const n = parseFloat(data.horasNocturnas) || 0;
                    if (n > 0) add(`Nocturnidad ${n}h`, n * rates.night, 'moon');
                }
                return res;
            }, [rates, globalRates, profile.kmCount]);

            const stats = useMemo(() => {
                const s = { month: { total: 0, trc: 0, tra: 0, call: 0, food: 0, km: 0, he: 0, night: 0, reten: 0, restHours: 0, custom: 0, p1: 0 } };
                Object.entries(shifts).forEach(([ds, data]) => {
                    const c = calcDay(ds, data);
                    const [y, m] = ds.split('-').map(Number);
                    if (y === viewDate.getFullYear() && m === (viewDate.getMonth() + 1)) {
                        s.month.total += c.total; s.month.restHours += c.restHours;
                        c.items.forEach(i => {
                            if (i.type === 'trc') s.month.trc += i.value;
                            else if (i.type === 'tra') s.month.tra += i.value;
                            else if (i.type === 'phone') s.month.call += i.value;
                            else if (i.type === 'food') s.month.food += i.value;
                            else if (i.type === 'map') s.month.km += i.value;
                            else if (i.type === 'clock') s.month.he += i.value;
                            else if (i.type === 'moon') s.month.night += i.value;
                            else if (i.type === 'shield') s.month.reten += i.value;
                            else if (i.type === 'p1_bonus') s.month.p1 += i.value;
                            else if (i.type === 'custom') s.month.custom += i.value;
                        });
                    }
                });
                return s;
            }, [shifts, viewDate, calcDay]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setUi(p => ({ ...p, error: '' }));
                try {
                    if (authFields.mode === 'register') await createUserWithEmailAndPassword(auth, authFields.email, authFields.pass);
                    else await signInWithEmailAndPassword(auth, authFields.email, authFields.pass);
                } catch (err) { setUi(p => ({ ...p, error: 'Acceso denegado' })); }
            };

            const PriceConfigPage = () => {
                const [localGlobal, setLocalGlobal] = useState(globalRates);
                const [localMatrix, setLocalMatrix] = useState(salaryMatrix);
                const saveAll = () => {
                    setGlobalRates(localGlobal);
                    setSalaryMatrix(localMatrix);
                    save(localGlobal, 'globalRates');
                    save(localMatrix, 'salaryMatrix');
                };

                return (
                    <div className="space-y-12 animate-in pb-20">
                        <section className="bg-white p-8 rounded-[40px] shadow-xl border border-slate-100">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10 gap-4">
                                <div>
                                    <h3 className="text-xl font-black flex items-center gap-3 uppercase tracking-tight"><Icon name="coins" className="text-indigo-600" /> Tarifas Globales</h3>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase mt-1">Configuración general del centro</p>
                                </div>
                                <button onClick={saveAll} className="px-8 py-3 bg-indigo-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-lg active:scale-95">Guardar Cambios</button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {Object.entries(localGlobal).map(([key, val]) => (
                                    <div key={key} className="space-y-2">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 leading-tight block">{GLOBAL_LABELS[key] || key.replace('_', ' ')}</label>
                                        <div className="relative">
                                            <input type="number" step="0.01" className="w-full bg-slate-50 p-4 rounded-2xl border-2 border-slate-100 font-black text-slate-800 outline-none focus:border-indigo-200 transition-all" value={val} onChange={e => setLocalGlobal({...localGlobal, [key]: parseFloat(e.target.value) || 0})} />
                                            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 font-black text-[10px]">€</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section className="bg-slate-900 p-8 rounded-[40px] shadow-2xl overflow-x-auto no-scrollbar">
                            <h3 className="text-xl font-black text-white mb-10 flex items-center gap-3 uppercase tracking-tight"><Icon name="table" className="text-indigo-400" /> Matriz Salarial por Grupos</h3>
                            <table className="w-full text-left min-w-[900px]">
                                <thead>
                                    <tr className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] border-b border-slate-800">
                                        <th className="pb-4 px-4">Grupo / Rango</th>
                                        {['HE', 'Noche', 'Plus Llamada', 'Retén L', 'Retén F'].map(h => <th key={h} className="pb-4 px-4 text-center">{h}</th>)}
                                    </tr>
                                </thead>
                                <tbody>
                                    {Object.entries(localMatrix).map(([group, ranges]) => (
                                        <React.Fragment key={group}>
                                            {Object.entries(ranges).map(([range, data], idx) => (
                                                <tr key={`${group}-${range}`} className={`border-b border-slate-800/50 hover:bg-white/5 transition-colors ${idx === 0 ? 'bg-white/5' : ''}`}>
                                                    <td className="py-4 px-4">
                                                        <span className={`text-xs font-black block ${group === profile.group ? 'text-indigo-400' : 'text-slate-400'}`}>{group}</span>
                                                        <span className="text-[9px] font-bold text-slate-500 uppercase tracking-tighter">Niveles {range}</span>
                                                    </td>
                                                    {Object.entries(data).map(([field, val]) => (
                                                        <td key={field} className="py-2 px-2">
                                                            <input type="number" step="0.01" className={`w-full bg-slate-800/50 p-2 rounded-xl text-center text-xs font-bold border outline-none transition-all ${group === profile.group && ((profile.level <= 9 && range === "1-9") || (profile.level >= 10 && range === "10-12")) ? 'text-indigo-400 border-indigo-900' : 'text-white border-slate-700'}`} value={val} onChange={e => {
                                                                const newMatrix = {...localMatrix};
                                                                newMatrix[group][range][field] = parseFloat(e.target.value) || 0;
                                                                setLocalMatrix(newMatrix);
                                                            }} />
                                                        </td>
                                                    ))}
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    ))}
                                </tbody>
                            </table>
                        </section>
                    </div>
                );
            };

            if (loading) return <div className="min-h-screen bg-slate-900 flex items-center justify-center"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>;

            if (!user) return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 antialiased">
                    <div className="bg-slate-900 w-full max-sm rounded-[40px] shadow-2xl p-10 border border-slate-800 animate-in">
                        <div className="flex flex-col items-center mb-10"><Icon name="calendar" size={40} className="text-indigo-500 mb-4" /><h1 className="text-2xl font-black text-white">ShiftExpert</h1></div>
                        <form onSubmit={handleAuth} className="space-y-4">
                            <input type="email" required className="w-full bg-slate-800 p-4 rounded-2xl outline-none text-white text-sm border border-slate-700" placeholder="Email" value={authFields.email} onChange={e => setAuthFields({...authFields, email: e.target.value})} />
                            <input type="password" required className="w-full bg-slate-800 p-4 rounded-2xl outline-none text-white text-sm border border-slate-700" placeholder="Password" value={authFields.pass} onChange={e => setAuthFields({...authFields, pass: e.target.value})} />
                            <button type="submit" className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl uppercase text-xs tracking-widest">{authFields.mode === 'login' ? 'Entrar' : 'Registrarse'}</button>
                            <button type="button" onClick={() => setAuthFields({...authFields, mode: authFields.mode === 'login' ? 'register' : 'login'})} className="w-full text-[10px] font-black text-slate-500 uppercase tracking-widest">{authFields.mode === 'login' ? 'Crear Cuenta' : 'Ya tengo cuenta'}</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 pb-20">
                    {/* BARRA DE USUARIO SUPERIOR (GLOBAL) */}
                    <div className="w-full bg-slate-900 text-slate-400 py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest shadow-md">
                        <div className="flex items-center gap-2">
                            <Icon name="user" size={12} className="text-indigo-500" />
                            <span className="text-white">Sesión activa: {user.email}</span>
                        </div>
                        <div className="hidden md:block italic opacity-50">ANAV ShiftExpert v8.8</div>
                    </div>

                    <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-5">
                                <div className="bg-indigo-600 p-5 rounded-3xl text-white shadow-xl rotate-3"><Icon name="calendar" size={28} /></div>

                                                            }}
                                                        />
                                                        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] text-blue-300 font-bold uppercase">Km</span>
                                                    </div>
                                                ))}
                                            </div>
                                            <p className="text-[9px] font-bold text-slate-400 italic mt-2">* Estos kilómetros se sumarán a los base ({selected.activeConceptsCount.comp_km} x {profile.kmCount}km)</p>
                                        </section>
                                    )}

                                    {/* SECCIÓN OTROS CONCEPTOS */}
                                    {(selected.activeConceptsCount?.otros > 0) && (
                                        <section className="bg-indigo-50/50 p-6 rounded-[32px] border-2 border-indigo-100 space-y-4 animate-in">
                                            <label className="text-[10px] font-black uppercase text-indigo-600 block mb-2 tracking-widest flex items-center gap-2"><Icon name="edit-3" size={14}/> Detalle Conceptos "Otros"</label>
                                            {(selected.manualEntries || []).map((entry, idx) => (
                                                <div key={idx} className="flex gap-3 items-center">
                                                    <input 
                                                        type="text" 
                                                        placeholder="Concepto (ej. Plus Pantalla)" 
                                                        className="flex-1 bg-white p-3 rounded-xl border border-indigo-100 text-xs font-bold outline-none focus:border-indigo-400"
                                                        value={entry.label}
                                                        onChange={e => {
                                                            const newEntries = [...selected.manualEntries];
                                                            newEntries[idx].label = e.target.value;
                                                            const upd = {...selected, manualEntries: newEntries};
                                                            setSelected(upd);
                                                            const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts');
                                                        }}
                                                    />
                                                    <div className="relative w-28">
                                                        <input 
                                                            type="number" 
                                                            placeholder="€" 
                                                            className="w-full bg-white p-3 rounded-xl border border-indigo-100 text-xs font-black outline-none focus:border-indigo-400 text-right pr-6"
                                                            value={entry.value || ''}
                                                            onChange={e => {
                                                                const newEntries = [...selected.manualEntries];
                                                                newEntries[idx].value = parseFloat(e.target.value) || 0;
                                                                const upd = {...selected, manualEntries: newEntries};
                                                                setSelected(upd);
                                                                const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts');
                                                            }}
                                                        />
                                                        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-300 font-bold">€</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </section>
                                    )}

                                    <section className="space-y-6"><div className="grid grid-cols-2 gap-4"><div className="space-y-2"><label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Extras (H)</label><input type="number" step="0.5" className="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 text-3xl font-black text-slate-800 outline-none focus:border-indigo-200 transition-all" value={selected.extras || 0} onChange={e => { const v = parseFloat(e.target.value) || 0; const upd = {...selected, extras: v}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} /></div><div className="space-y-2"><label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Noche (H)</label><input type="number" step="0.5" className="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 text-3xl font-black text-slate-800 outline-none focus:border-indigo-200 transition-all" value={selected.horasNocturnas || 0} onChange={e => { const v = parseFloat(e.target.value) || 0; const upd = {...selected, extras: v}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} /></div></div>
                                    {(parseFloat(selected.extras) > 0) && (
                                        <div className="bg-indigo-50 p-6 rounded-[32px] border-2 border-indigo-100 animate-in">
                                            <label className="text-[10px] font-black uppercase text-indigo-600 block mb-4 tracking-widest">Compensación HE</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                <button onClick={() => { 
                                                    const upd = {...selected, extraCompMode: 'money'}; 
                                                    setSelected(upd); 
                                                    const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); 
                                                }} className={`py-3 rounded-xl border-2 font-black text-[9px] uppercase transition-all ${selected.extraCompMode === 'money' || !selected.extraCompMode ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-400 border-slate-100 hover:border-indigo-200'}`}>Pago</button>
                                                
                                                <button onClick={() => { 
                                                    const upd = {...selected, extraCompMode: 'rest_total'}; 
                                                    setSelected(upd); 
                                                    const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); 
                                                }} className={`py-3 rounded-xl border-2 font-black text-[9px] uppercase transition-all ${selected.extraCompMode === 'rest_total' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-400 border-slate-100 hover:border-indigo-200'}`}>Descanso</button>
                                                
                                                <button onClick={() => { 
                                                    const upd = {...selected, extraCompMode: 'mixed'}; 
                                                    setSelected(upd); 
                                                    const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); 
                                                }} className={`py-3 rounded-xl border-2 font-black text-[9px] uppercase transition-all ${selected.extraCompMode === 'mixed' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-400 border-slate-100 hover:border-indigo-200'}`}>Cobrar+Comp</button>
                                            </div>
                                        </div>
                                    )}
                                    </section>
                                </div>
                                <div className="p-8 bg-slate-50 border-t border-slate-100 flex justify-end gap-3"><button onClick={() => { const ns = {...shifts}; delete ns[selected.ds]; setShifts(ns); save(ns, 'shifts'); setUi({...ui, modal: false}); }} className="px-6 py-4 bg-red-50 text-red-600 font-black rounded-2xl uppercase text-[10px] tracking-widest hover:bg-red-100 transition-colors">Borrar</button><button onClick={() => setUi({...ui, modal: false})} className="px-10 py-4 bg-slate-900 text-white font-black rounded-2xl uppercase text-[10px] shadow-lg hover:bg-slate-800 active:scale-95 transition-all">Listo</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
