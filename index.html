
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANAV ShiftExpert v14.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useCallback } = React;

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Configuración real recuperada de tu historial
        const firebaseConfig = {
            apiKey: "AIzaSyDaAn2WUiHDnIRU5SZ9sogOsICUcvG1DSI",
            authDomain: "notasdegasto-12d33.firebaseapp.com",
            projectId: "notasdegasto-12d33",
            storageBucket: "notasdegasto-12d33.firebasestorage.app",
            messagingSenderId: "979069209782",
            appId: "1:979069209782:web:1d7ccd86e6b9f390caea17"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = 'anav-shiftexpert-v14';

        const DEFAULT_SALARY_DATA = {
            "G I": { "1-9": { extra: 106.34, night: 8.75, call: 134.98, r_l: 62.47, r_f: 108.35 }, "10-12": { extra: 119.26, night: 9.80, call: 147.54, r_l: 64.31, r_f: 115.20 } },
            "G II": { "1-9": { extra: 84.49, night: 6.95, call: 113.97, r_l: 59.86, r_f: 102.15 }, "10-12": { extra: 94.79, night: 7.80, call: 123.86, r_l: 60.80, r_f: 108.40 } },
            "G III": { "1-9": { extra: 69.90, night: 5.75, call: 98.81, r_l: 58.07, r_f: 98.60 }, "10-12": { extra: 75.34, night: 6.20, call: 105.42, r_l: 59.86, r_f: 102.30 } },
            "G IV": { "1-9": { extra: 58.31, night: 4.80, call: 85.12, r_l: 57.23, r_f: 95.10 }, "10-12": { extra: 63.82, night: 5.25, call: 92.45, r_l: 57.23, r_f: 95.10 } },
            "G V": { "1-9": { extra: 49.79, night: 4.11, call: 74.64, r_l: 55.48, r_f: 92.15 }, "10-12": { extra: 49.79, night: 4.11, call: 74.64, r_l: 55.48, r_f: 92.15 } },
            "G VI": { "1-9": { extra: 43.12, night: 3.55, call: 68.20, r_l: 53.10, r_f: 88.40 }, "10-12": { extra: 43.12, night: 3.55, call: 68.20, r_l: 53.10, r_f: 88.40 } },
            "G VII": { "1-9": { extra: 38.50, night: 3.15, call: 62.15, r_l: 51.20, r_f: 85.00 }, "10-12": { extra: 38.50, night: 3.15, call: 62.15, r_l: 51.20, r_f: 85.00 } }
        };

        const DEFAULT_GLOBAL_CONST = { 
            TRC: 55.01, TRA: 20.90, CALL_L: 54.47, CALL_F: 98.35, FOOD: 40.69, KM_PRICE: 0.55, P1_BASE: 32.90, P1_FRI: 46.74
        };

        const GLOBAL_LABELS = {
            TRC: "Plus TRC", TRA: "Plus TRA", CALL_L: "Comp. Llamada (Laboral)", CALL_F: "Comp. Llamada (Festivo)", FOOD: "Ayuda Comida", KM_PRICE: "Precio Kilometraje", P1_BASE: "Plus P1 (Lun-Jue)", P1_FRI: "Plus P1 (Viernes)"
        };

        const SHIFTS = [
            { id: 'D', color: 'bg-green-600 text-white', desc: 'Descanso / Vacaciones', time: '-', nightHours: 0 },
            { id: 'P1', color: 'bg-slate-200 text-slate-700', desc: 'Jornada Partida', time: '07:00 a 16:30', nightHours: 0 },
            { id: 'I7', color: 'bg-slate-200 text-slate-700', desc: 'I7 Abierto Mañana / Tarde', time: '-', nightHours: 0 },
            { id: 'R1', color: 'bg-yellow-100 text-yellow-800', desc: 'Abierto Recarga Mañana', time: '06:00 a 14:30', nightHours: 0 },
            { id: 'R3', color: 'bg-yellow-200 text-yellow-900', desc: 'Abierto Recarga Tarde', time: '14:00 a 22:30', nightHours: 0.5 },
            { id: 'R7', color: 'bg-pink-100 text-pink-800', desc: 'R7 TRC 12h', time: '07:00 a 19:00', nightHours: 0 },
            { id: 'R9', color: 'bg-blue-100 text-blue-800', desc: 'R9 TRC 12h', time: '19:00 a 07:00', nightHours: 8 },
            { id: 'S1', color: 'bg-orange-100 text-orange-800', desc: 'Cerrado Recarga Mañana', time: '06:00 a 14:00', nightHours: 0 },
            { id: 'S3', color: 'bg-green-100 text-green-800', desc: 'Cerrado Recarga Tarde', time: '14:00 a 22:00', nightHours: 0 },
            { id: 'S5', color: 'bg-purple-100 text-purple-800', desc: 'Cerrado Recarga Noche', time: '22:00 a 06:00', nightHours: 8 },
        ];

        const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        const Icon = React.memo(({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <span className={`inline-flex items-center justify-center ${className}`}><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        });

        const PieChart = ({ data }) => {
            const total = data.reduce((acc, item) => acc + item.value, 0);
            let cumulativeAngle = 0;
            if (total <= 0) return <div className="flex items-center justify-center h-64 bg-slate-100 rounded-full border-4 border-dashed border-slate-200"><p className="text-slate-400 font-bold uppercase text-[10px]">Sin Datos</p></div>;
            return (
                <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90">
                    {data.map((item, index) => {
                        if (item.value <= 0) return null;
                        const angle = (item.value / total) * 360;
                        const x1 = 50 + 40 * Math.cos((Math.PI * cumulativeAngle) / 180);
                        const y1 = 50 + 40 * Math.sin((Math.PI * cumulativeAngle) / 180);
                        cumulativeAngle += angle;
                        const x2 = 50 + 40 * Math.cos((Math.PI * cumulativeAngle) / 180);
                        const y2 = 50 + 40 * Math.sin((Math.PI * cumulativeAngle) / 180);
                        return <path key={index} d={`M 50 50 L ${x1} ${y1} A 40 40 0 ${angle > 180 ? 1 : 0} 1 ${x2} ${y2} Z`} fill={item.color} />;
                    })}
                    <circle cx="50" cy="50" r="22" fill="white" />
                </svg>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [viewDate, setViewDate] = useState(new Date());
            const [shifts, setShifts] = useState({});
            const [profile, setProfile] = useState({ group: "G V", level: "7", kmCount: 46 });
            const [globalRates, setGlobalRates] = useState(DEFAULT_GLOBAL_CONST);
            const [salaryMatrix, setSalaryMatrix] = useState(DEFAULT_SALARY_DATA);
            const [selected, setSelected] = useState(null);
            const [ui, setUi] = useState({ modal: false, settings: false, tab: 'calendar', error: '' });
            const [authFields, setAuthFields] = useState({ email: '', pass: '', mode: 'login' });
            const [isIncognito, setIsIncognito] = useState(false);

            const save = useCallback(async (data, path) => {
                if (!user) return;
                try {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', path), { data, updatedAt: Date.now() });
                } catch (e) { console.error(e); }
            }, [user]);

            useEffect(() => {
                const unsubAuth = onAuthStateChanged(auth, (u) => { 
                    setUser(u); setLoading(false); 
                    if (!u) setShifts({});
                });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubShifts = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'shifts'), snap => snap.exists() && setShifts(snap.data().data || {}));
                const unsubProfile = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'profile'), snap => snap.exists() && setProfile(p => ({ ...p, ...snap.data().data })));
                const unsubGlobalRates = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'globalRates'), snap => snap.exists() && setGlobalRates(snap.data().data || DEFAULT_GLOBAL_CONST));
                const unsubSalaryMatrix = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'salaryMatrix'), snap => snap.exists() && setSalaryMatrix(snap.data().data || DEFAULT_SALARY_DATA));
                return () => { unsubShifts(); unsubProfile(); unsubGlobalRates(); unsubSalaryMatrix(); };
            }, [user]);

            const rates = useMemo(() => {
                const g = salaryMatrix[profile.group] || salaryMatrix["G V"];
                const lvl = parseInt(profile.level) || 1;
                return g[lvl <= 9 ? "1-9" : "10-12"];
            }, [profile, salaryMatrix]);

            const calcDay = useCallback((dateStr, data) => {
                if (!data) return { total: 0, restHours: 0, items: [] };
                const d = new Date(dateStr);
                const isSun = d.getDay() === 0;
                const isSat = d.getDay() === 6;
                const isF = isSun || isSat || data.isFestive;
                const isFri = d.getDay() === 5;
                const res = { total: 0, restHours: 0, items: [] };

                const add = (label, val, type, qty = 1) => {
                    const v = parseFloat(val) || 0;
                    if (v > 0) { 
                        res.total += v; 
                        res.items.push({ label, value: v, type, qty: parseFloat(qty) }); 
                    }
                };

                if (isSun && data.shift && data.shift !== 'D') {
                    res.restHours += 8;
                    res.items.push({ label: "Descanso Domingo", value: 8, type: 'coffee', qty: 8 });
                }

                if (data.isReten) add(`Retén ${isF ? 'F' : 'L'}`, isF ? rates.r_f : rates.r_l, 'reten', 1);
                
                // LÓGICA KM V14.1
                const isRestrictedShift = (data.shift === 'R7' || data.shift === 'R9');
                const hasBaseKm = (data.activeConceptsCount?.comp_km || 0) > 0;
                const pertocaBase = hasBaseKm && !(isRestrictedShift && !isF);
                const bKm = pertocaBase ? (profile.kmCount || 0) : 0;
                const extraKm = parseFloat(data.extraKm) || 0;
                const totalKm = bKm + extraKm;
                
                if (totalKm > 0) add(`Kilometraje (${totalKm}km)`, totalKm * globalRates.KM_PRICE, 'km', totalKm);

                const concepts = data.activeConceptsCount || {};
                Object.entries(concepts).forEach(([id, count]) => {
                    if (count <= 0 || id === 'comp_km') return;
                    if (isRestrictedShift && ['plus_llamada', 'comp_llamada'].includes(id) && !isF) return;

                    if (id === 'trc') {
                        // REGLA S3: 1x laboral, 2x festivo
                        const m = data.shift === 'R7' ? 1.5 : 
                                  data.shift === 'R9' ? 2.5 : 
                                  ['S1', 'S3'].includes(data.shift) ? (isF ? 2 : 1) : 
                                  ['S5'].includes(data.shift) ? (isF ? 3 : 2) : 1;
                        add(`Plus TRC ${m}x (x${count})`, (globalRates.TRC * m) * count, 'trc', count);
                    }
                    if (id === 'tra') add(`Plus TRA ${isF ? 3 : 2}x (x${count})`, (globalRates.TRA * (isF ? 3 : 2)) * count, 'tra', count);
                    if (id === 'plus_llamada') add(`Plus Llamada (x${count})`, rates.call * count, 'call_plus', count);
                    if (id === 'comp_llamada' && !data.isReten) add(`Comp. Llamada (x${count})`, (isF ? globalRates.CALL_F : globalRates.CALL_L) * count, 'call_comp', count);
                    if (id === 'comida') add(`Ayuda Comida (x${count})`, globalRates.FOOD * count, 'food', count);
                });

                if (data.manualEntries) data.manualEntries.forEach(e => e.value > 0 && add(e.label || 'Otros', e.value, 'custom', 1));
                if (data.shift === 'P1') add(`Plus P1 ${isFri ? '(Viernes)' : ''}`, isFri ? globalRates.P1_FRI : globalRates.P1_BASE, 'p1', 1);

                if (data.shift && data.shift !== 'D') {
                    const h = parseFloat(data.extras) || 0;
                    if (h > 0) {
                        const isNf = isF || (parseFloat(data.horasNocturnas) > 0);
                        const compMode = data.extraCompMode || 'money';
                        if (compMode === 'mixed') {
                            res.restHours += h; 
                            res.items.push({ label: `Descanso HE (1x)`, value: h, type: 'coffee', qty: h });
                            add(`HE Cobro (0.75x)`, h * rates.extra * 0.75, 'he', h);
                        } else if (compMode === 'rest_total') {
                            const mult = isNf ? 2 : 1.75; 
                            res.restHours += h * mult;
                            res.items.push({ label: `Descanso HE (${mult}x)`, value: h * mult, type: 'coffee', qty: h * mult });
                        } else add(`HE Cobro 100%`, h * rates.extra, 'he', h);
                    }
                    const n = parseFloat(data.horasNocturnas) || 0;
                    if (n > 0) add(`Nocturnidad ${n}h`, n * rates.night, 'night', n);
                }
                return res;
            }, [rates, globalRates, profile.kmCount]);

            const stats = useMemo(() => {
                const init = () => ({ val: 0, count: 0 });
                const s = { month: { total: 0, trc: init(), tra: init(), call_plus: init(), call_comp: init(), food: init(), km: init(), he: init(), night: init(), reten: init(), restHours: 0, custom: init(), p1: init() } };
                Object.entries(shifts).forEach(([ds, data]) => {
                    const c = calcDay(ds, data), [y, m] = ds.split('-').map(Number);
                    if (y === viewDate.getFullYear() && m === (viewDate.getMonth() + 1)) {
                        s.month.total += c.total; s.month.restHours += c.restHours;
                        c.items.forEach(i => { if (s.month[i.type]) { s.month[i.type].val += i.value; s.month[i.type].count += (i.qty || 1); } });
                    }
                });
                return s;
            }, [shifts, viewDate, calcDay]);

            const handleAuth = async (e) => {
                e.preventDefault();
                try { 
                    if (authFields.mode === 'register') await createUserWithEmailAndPassword(auth, authFields.email, authFields.pass); 
                    else await signInWithEmailAndPassword(auth, authFields.email, authFields.pass); 
                } catch (err) { setUi(p => ({ ...p, error: 'Credenciales inválidas' })); }
            };

            if (loading) return <div className="min-h-screen bg-slate-900 flex items-center justify-center"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>;

            if (!user) return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 antialiased">
                    <div className="bg-slate-900 w-full max-w-md rounded-[40px] shadow-2xl p-10 border border-slate-800 animate-in text-center">
                        <Icon name="calendar" size={40} className="text-indigo-500 mb-4" />
                        <h1 className="text-2xl font-black text-white uppercase tracking-tight mb-10">ShiftExpert v14.1</h1>
                        <form onSubmit={handleAuth} className="space-y-4">
                            <input type="email" required className="w-full bg-slate-800 p-4 rounded-2xl text-white text-sm" placeholder="Email" value={authFields.email} onChange={e => setAuthFields({...authFields, email: e.target.value})} />
                            <input type="password" required className="w-full bg-slate-800 p-4 rounded-2xl text-white text-sm" placeholder="Password" value={authFields.pass} onChange={e => setAuthFields({...authFields, pass: e.target.value})} />
                            <button type="submit" className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl uppercase text-xs tracking-widest">{authFields.mode === 'login' ? 'Entrar' : 'Registrarse'}</button>
                            <button type="button" onClick={() => setAuthFields({...authFields, mode: authFields.mode === 'login' ? 'register' : 'login'})} className="w-full text-[10px] font-black text-slate-500 uppercase tracking-widest mt-2">{authFields.mode === 'login' ? 'Crear Cuenta' : 'Ya tengo cuenta'}</button>
                            {ui.error && <p className="text-red-400 text-[10px] font-black mt-2">{ui.error}</p>}
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 pb-20">
                    <div className="w-full bg-slate-900 text-slate-400 py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest shadow-md">
                        <div className="flex items-center gap-2"><Icon name="user" size={12} className="text-indigo-500" /><span className="text-white">Sesión: {user.email}</span></div>
                        <div className="hidden md:block italic opacity-50">ANAV ShiftExpert v14.1</div>
                    </div>

                    <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-5">
                                <div className="bg-indigo-600 p-5 rounded-3xl text-white shadow-xl rotate-3"><Icon name="calendar" size={28} /></div>
                                <div><h2 className="text-2xl font-black text-slate-900 tracking-tight">ShiftExpert v14.1</h2><p className="text-[10px] font-black uppercase text-indigo-500 tracking-widest">Calculadora de Jornada</p></div>
                            </div>
                            <div className="flex bg-white p-1.5 rounded-[24px] shadow-lg border border-slate-100 items-center overflow-x-auto no-scrollbar">
                                <button onClick={() => setIsIncognito(!isIncognito)} className={`px-4 py-3 rounded-2xl flex items-center gap-2 transition-all mr-1 ${isIncognito ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-indigo-600'}`}><Icon name={isIncognito ? "eye-off" : "eye"} size={16} /><span className="text-[10px] font-black uppercase">{isIncognito ? 'ON' : 'Incógnito'}</span></button>
                                {['calendar', 'stats', 'precios'].map(t => (<button key={t} onClick={() => setUi({...ui, tab: t})} className={`px-8 py-3 rounded-2xl text-[10px] font-black uppercase transition-all ${ui.tab === t ? 'bg-slate-900 text-white shadow-md scale-105' : 'text-slate-400 hover:text-slate-600'}`}>{t === 'precios' ? 'Precios' : t === 'stats' ? 'Balance' : 'Calendario'}</button>))}
                                <button onClick={() => setUi({...ui, settings: true})} className="px-4 py-3 text-indigo-400 hover:text-indigo-600"><Icon name="user-cog" size={18}/></button>
                                <button onClick={() => signOut(auth)} className="px-4 py-3 text-red-400 hover:text-red-600"><Icon name="log-out" size={18}/></button>
                            </div>
                        </div>

                        {ui.tab === 'calendar' && (
                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-8 animate-in">
                                <div className="lg:col-span-3 bg-white shadow-2xl rounded-[48px] overflow-hidden border border-slate-100">
                                    <div className="flex justify-between items-center p-8 border-b border-slate-50">
                                        <button onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1))} className="p-4 bg-slate-50 rounded-3xl hover:bg-indigo-50 transition-all"><Icon name="chevron-left" size={24}/></button>
                                        <h3 className="text-xl font-black text-slate-800 capitalize">{viewDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}</h3>
                                        <button onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1))} className="p-4 bg-slate-50 rounded-3xl hover:bg-indigo-50 transition-all"><Icon name="chevron-right" size={24}/></button>
                                    </div>
                                    <div className="grid grid-cols-7 bg-slate-900 text-white py-4 text-center text-[9px] font-black uppercase opacity-90">{['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => <div key={d}>{d}</div>)}</div>
                                    <div className="grid grid-cols-7">
                                        {(() => {
                                            const y = viewDate.getFullYear(), m = viewDate.getMonth(), start = (new Date(y, m, 1).getDay() + 6) % 7, total = new Date(y, m + 1, 0).getDate(), cells = [];
                                            for(let i=0; i<start; i++) cells.push(<div key={`e-${i}`} className="h-32 md:h-52 bg-slate-50/20 border border-slate-100"></div>);
                                            for(let d=1; d<=total; d++) {
                                                const ds = toISO(new Date(y, m, d)), dt = shifts[ds], cl = calcDay(ds, dt), isV = (new Date(y, m, d).getDay() === 0 || new Date(y, m, d).getDay() === 6 || dt?.isFestive);
                                                cells.push(
                                                    <div key={d} onClick={() => { setSelected({ day: d, ds, ...dt }); setUi({...ui, modal: true}); }} className={`h-56 md:h-64 border border-slate-100 p-3 cursor-pointer transition-all hover:bg-indigo-50 flex flex-col ${isV ? 'bg-red-50/20' : 'bg-white'}`}>
                                                        <div className="flex justify-between items-start mb-2"><span className={`text-[12px] font-black ${isV ? 'text-red-400' : 'text-slate-300'}`}>{d}</span><div className="flex flex-col items-end gap-1">{cl.total > 0 && <span className="text-[10px] font-black text-green-700 bg-white px-2 py-1 rounded-xl shadow-sm border border-green-100">{isIncognito ? 'xxx€' : cl.total.toFixed(2) + '€'}</span>}{cl.restHours > 0 && (<div className="flex items-center gap-1 text-blue-600 font-black text-[9px] bg-blue-50 px-2 py-1 rounded-lg shadow-sm border border-blue-100"><Icon name="coffee" size={10} /><span>{cl.restHours.toFixed(2)}h</span></div>)}</div></div>
                                                        <div className="space-y-1 overflow-y-auto no-scrollbar flex-1">
                                                            {dt?.isReten && <div className="text-[8px] bg-indigo-600 text-white font-black px-2 py-1 rounded-lg text-center uppercase mb-1">Retén</div>}
                                                            {dt?.shift && <div className={`text-[9px] font-black text-center px-2 py-1 rounded-xl shadow-sm mb-2 ${SHIFTS.find(s => s.id === dt.shift)?.color || 'bg-slate-100'}`}>{dt.shift}</div>}
                                                            <div className="space-y-1">{cl.items.map((it, idx) => (<div key={idx} className={`flex justify-between text-[8px] font-bold border-b border-slate-50 pb-0.5 ${it.type === 'coffee' ? 'text-blue-600' : 'text-slate-500'}`}><span className="truncate pr-1">{it.label}</span><span className="shrink-0">{it.type === 'coffee' ? (it.value.toFixed(2) + 'h') : (isIncognito ? 'xxx€' : it.value.toFixed(2) + '€')}</span></div>))}</div>
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            return cells;
                                        })()}
                                    </div>
                                </div>
                                <div className="space-y-6">
                                    <div className="bg-white p-8 rounded-[40px] shadow-2xl border border-slate-100">
                                        <h3 className="text-sm font-black uppercase text-slate-400 mb-8 flex items-center gap-2"><Icon name="bar-chart-3" className="text-indigo-600" /> Resumen Mes</h3>
                                        <div className="space-y-4">
                                            {[
                                                { l: 'Bruto Variable', v: stats.month.total, s: '€', c: 'text-2xl font-black text-slate-900', m: true },
                                                { l: 'Descanso Acumulado', v: stats.month.restHours, s: 'h', c: 'text-xl font-black text-blue-600' },
                                                { l: 'Plus TRC', v: stats.month.trc.val, s: '€', q: stats.month.trc.count, m: true },
                                                { l: 'Kilometraje', v: stats.month.km.val, s: '€', q: stats.month.km.count, u: 'km', m: true },
                                                { l: 'Horas Extra (Pago)', v: stats.month.he.val, s: '€', q: stats.month.he.count, u: 'h', m: true },
                                                { l: 'Nocturnidad', v: stats.month.night.val, s: '€', q: stats.month.night.count, u: 'h', m: true },
                                            ].map(i => (i.v > 0 || i.l === 'Bruto Variable') ? (
                                                <div key={i.l} className="flex flex-col border-b border-slate-50 pb-2 last:border-0">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">{i.l}</span>
                                                        {i.q > 0 && <span className="text-[9px] font-bold text-indigo-400">x{i.q.toFixed(1)}{i.u || ''}</span>}
                                                    </div>
                                                    <span className={i.c || 'text-sm font-black text-slate-700'}>{isIncognito && i.m ? 'xxx€' : (i.v.toLocaleString('es-ES', { minimumFractionDigits: 2 }) + i.s)}</span>
                                                </div>
                                            ) : null)}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        {/* Pestaña Balance y Ajustes simplificada para el ejemplo... */}
                        {ui.tab === 'stats' && <div className="p-20 text-center font-black uppercase text-slate-300">Balance Detallado en Construcción v14.1</div>}
                        {ui.tab === 'precios' && <div className="p-20 text-center font-black uppercase text-slate-300">Editor de Tarifas en Construcción v14.1</div>}
                    </div>

                    {ui.modal && selected && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md animate-in">
                            <div className="bg-white w-full max-w-2xl rounded-[48px] shadow-2xl overflow-hidden border border-white/10">
                                <div className="bg-slate-900 p-8 text-white flex justify-between items-center"><div><p className="text-indigo-400 text-[10px] font-black uppercase mb-1">Editor de Jornada</p><h3 className="text-3xl font-black tracking-tighter">{new Date(selected.ds).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}</h3></div><button onClick={() => setUi({...ui, modal: false})} className="p-3 bg-white/10 rounded-2xl hover:bg-white/20 transition-colors"><Icon name="x" size={24} /></button></div>
                                <div className="p-8 max-h-[70vh] overflow-y-auto no-scrollbar space-y-8">
                                    <div className="grid grid-cols-2 gap-4">
                                        <section onClick={() => { const nr = !selected.isReten; const upd = {...selected, isReten: nr}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} className={`p-5 rounded-[28px] border-4 flex items-center justify-between cursor-pointer ${selected.isReten ? 'border-indigo-600 bg-indigo-50 shadow-md' : 'border-slate-100 bg-slate-50 opacity-60'}`}><div className="flex items-center gap-4"><Icon name="shield-check" size={24} /><h4 className="font-bold">Retén</h4></div></section>
                                        <section onClick={() => { const nf = !selected.isFestive; let upd = {...selected, isFestive: nf}; if (['R7', 'R9'].includes(selected.shift)) { upd.extras = nf ? 12 : 3.5; if (nf) upd.activeConceptsCount = { ...(upd.activeConceptsCount || {}), comp_km: 1, trc: 1, comida: 1 }; } setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} className={`p-5 rounded-[28px] border-4 flex items-center justify-between cursor-pointer ${selected.isFestive ? 'border-red-600 bg-red-50 shadow-md' : 'border-slate-100 bg-slate-50 opacity-60'}`}><div className="flex items-center gap-4"><Icon name="party-popper" size={24} /><h4 className="font-bold">Festivo</h4></div></section>
                                    </div>
                                    <section><label className="text-[10px] font-black uppercase text-slate-400 block mb-4">Turno</label><div className="grid grid-cols-5 gap-2">{SHIFTS.map(s => (<button key={s.id} onClick={() => { 
                                        const d = new Date(selected.ds), f = d.getDay() === 0 || d.getDay() === 6 || selected.isFestive; 
                                        const upd = { ...selected, shift: s.id, activeConceptsCount: (['R7', 'R9'].includes(s.id) ? (f ? {trc: 1, comida: 1, comp_km: 1} : {trc: 1, comida: 1}) : ['S1', 'S3', 'S5'].includes(s.id) ? {trc: 1} : {}), extras: (['R7', 'R9'].includes(s.id) ? (f ? 12 : 3.5) : 0), horasNocturnas: s.nightHours || 0 }; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); 
                                    }} className={`py-3 rounded-xl border-2 font-black text-[10px] ${selected.shift === s.id ? 'border-indigo-600 bg-indigo-50 text-indigo-800' : 'border-slate-100 text-slate-400'}`}>{s.id}</button>))}</div></section>
                                    
                                    {/* LÓGICA DE KM V14.1 EN MODAL */}
                                    <section className="space-y-4">
                                        <label className="text-[10px] font-black uppercase text-slate-400 block tracking-widest">Kilometraje v14.1</label>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div onClick={() => { const ck = (selected.activeConceptsCount?.comp_km || 0) > 0 ? 0 : 1; const upd = {...selected, activeConceptsCount: {...selected.activeConceptsCount, comp_km: ck}}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} className={`p-4 rounded-3xl border-2 flex items-center justify-between cursor-pointer ${selected.activeConceptsCount?.comp_km > 0 ? 'border-indigo-600 bg-indigo-50' : 'border-slate-100 bg-slate-50'}`}>
                                                <div className="flex items-center gap-3"><Icon name="map" size={18}/><span className="text-[10px] font-black uppercase">Kilómetros Base ({profile.kmCount}km)</span></div>
                                                <div className={`w-8 h-4 rounded-full relative ${selected.activeConceptsCount?.comp_km > 0 ? 'bg-indigo-600' : 'bg-slate-300'}`}><div className={`absolute top-0.5 w-3 h-3 bg-white rounded-full transition-all ${selected.activeConceptsCount?.comp_km > 0 ? 'left-4' : 'left-0.5'}`}></div></div>
                                            </div>
                                            <div className="p-4 rounded-3xl border-2 border-slate-100 bg-slate-50 flex items-center justify-between">
                                                <div className="flex items-center gap-3"><Icon name="plus-circle" size={18}/><span className="text-[10px] font-black uppercase">Km Extra</span></div>
                                                <input type="number" className="w-16 bg-white border border-slate-200 rounded-lg p-1 text-center font-black text-xs" value={selected.extraKm || ''} onChange={e => { const val = parseFloat(e.target.value) || 0; const upd = {...selected, extraKm: val}; setSelected(upd); const ns = {...shifts, [upd.ds]: upd}; setShifts(ns); save(ns, 'shifts'); }} />
                                            </div>
                                        </div>
                                    </section>
                                </div>
                                <div className="p-8 bg-slate-50 border-t border-slate-100 flex justify-end gap-3"><button onClick={() => setUi({...ui, modal: false})} className="px-10 py-4 bg-slate-900 text-white font-black rounded-2xl uppercase text-[10px] shadow-lg">Listo</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
