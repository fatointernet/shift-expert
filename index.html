                        const percentage = (item.value / total) * 100;

                if (tool.isBase) {

                    if (typeof newPlan[ds] === 'object') {
                        current.base = newPlan[ds].base || null;

                        if (['intensiva', 'partida'].includes(newPlan[ds])) current.base = newPlan[ds];
                        else current.concepts = { [newPlan[ds]]: null };
                    }

                            current.base = p.base || null;

                            else if (p.concept) current.concepts = { [p.concept]: p.manualHours !== undefined ? p.manualHours : null };
                        } else if (typeof p === 'string') {
                            if (['intensiva', 'partida'].includes(p)) current.base = p;
                            else current.concepts = { [p]: null };
                        }
                    }
                    return current;
                });

                const handleHourChange = (cId, val) => {
                    const num = parseFloat(val);
                    setLocalData(prev => ({
                        ...prev,
                        concepts: {
                            ...prev.concepts,
                            [cId]: isNaN(num) ? null : num
                        }
                    }));
                };

                const handleRemoveConcept = (cId) => {
                    setLocalData(prev => {
                        const nc = {...prev.concepts};
                        delete nc[cId];
                        return { ...prev, concepts: nc };
                    });
                };

                const handleRemoveBase = () => {
                    setLocalData(prev => ({ ...prev, base: null }));
                };

                const handleSave = () => {
                    const newPlan = { ...annualPlan };
                    if (!localData.base && Object.keys(localData.concepts).length === 0) {
                        delete newPlan[ds];
                    } else {
                        newPlan[ds] = localData;
                    }
                    setAnnualPlan(newPlan);
                    save(newPlan, 'annual_plan');
                    setDayEditModal(null);
                };

                const getToolInfo = (id) => combinedTools.find(t => t.id === id) || { label: id, color: 'bg-slate-200 text-slate-800' };
                const dateObj = new Date(ds);

                return (
                    <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-in">

                                </div>
                                <h4 className="text-lg font-black capitalize tracking-tight">{dateStr}</h4>
                            </div>

                                {(!localData.base && Object.keys(localData.concepts).length === 0) ? (
                                    <p className="text-xs font-bold text-slate-400 text-center uppercase tracking-widest py-4">Sin datos imputados</p>

                                        {localData.base && (
                                            <div className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">

                                                    <div className={`w-3 h-3 rounded-full ${getToolInfo(localData.base).customColor ? '' : getToolInfo(localData.base).color}`} style={getToolInfo(localData.base).customColor ? { backgroundColor: getToolInfo(localData.base).customColor } : {}}></div>

                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-3 h-3 rounded-full ${getToolInfo(cId).customColor || getToolInfo(cId).hex ? '' : getToolInfo(cId).color}`} style={{ backgroundColor: getToolInfo(cId).customColor || getToolInfo(cId).hex }}></div>
                                                        <span className="text-[10px] font-black uppercase text-slate-700 truncate max-w-[150px]">{getToolInfo(cId).label}</span>
                                                    </div>
                                                    <button onClick={() => handleRemoveConcept(cId)} className="p-2 text-slate-300 hover:text-red-500 transition-colors"><Icon name="trash-2" size={14} /></button>
                                                </div>
                                                <div className="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-100">
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase">Horas Manuales:</span>

                                                        className="w-full bg-transparent text-right text-xs font-black text-indigo-600 outline-none"

                                                    />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <button onClick={handleSave} className="w-full py-4 bg-indigo-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-lg active:scale-95">Guardar Cambios</button>
                            </div>
                        </div>
                    </div>

            };

            return (
                <div className="space-y-12 animate-in relative">
                    {toolActionModal && <ToolActionModal data={toolActionModal} />}
                    {dayEditModal && <DayEditModal ds={dayEditModal} />}

                        <>
                            <div className="fixed inset-0 z-[110]" onClick={() => setUi({ ...ui, colorPicker: null })}></div>

                                <div className="flex justify-between items-center mb-4"><p className="text-[10px] font-black uppercase text-indigo-600 tracking-widest">Personalizar Color</p><button onClick={() => setUi({ ...ui, colorPicker: null })} className="p-1 hover:bg-slate-50 rounded-lg text-slate-300 hover:text-slate-600 transition-colors"><Icon name="x" size={16} /></button></div>
                                <div className="grid grid-cols-8 gap-2 mb-5">{BASIC_PALETTE.map(c => (<button key={c} onClick={() => { const nc = { ...userColors, [ui.colorPicker.id]: c }; setUserColors(nc); save(nc, 'userColors'); setUi({ ...ui, colorPicker: null }); }} className="w-5 h-5 rounded-md shadow-sm border border-black/5 hover:scale-125 hover:rotate-3 transition-transform active:scale-95" style={{ backgroundColor: c }}></button>))}</div>
                                <div className="border-t border-slate-50 pt-4">
                                    <label className="flex items-center justify-between cursor-pointer group bg-slate-50 p-2 rounded-xl border border-transparent hover:border-indigo-100 transition-all"><span className="text-[9px] font-black uppercase text-slate-400 group-hover:text-indigo-500">Selector Manual</span><div className="relative overflow-hidden w-7 h-7 rounded-full border-2 border-white shadow-sm"><input type="color" className="absolute inset-0 scale-150 cursor-pointer opacity-0" onChange={(e) => { const nc = { ...userColors, [ui.colorPicker.id]: e.target.value }; setUserColors(nc); save(nc, 'userColors'); }} /><div className="w-full h-full" style={{ backgroundColor: userColors[ui.colorPicker.id] || '#6366f1' }}></div></div></label>
                                    <button onClick={() => { const nc = { ...userColors }; delete nc[ui.colorPicker.id]; setUserColors(nc); save(nc, 'userColors'); setUi({ ...ui, colorPicker: null }); }} className="w-full mt-4 py-3 text-[9px] font-black uppercase text-red-400 bg-red-50 hover:bg-red-100 rounded-xl transition-colors">Restablecer Original</button>
                                </div>
                            </div>
                        </>

                    <div className="flex justify-center items-center gap-8 bg-white py-6 rounded-[40px] shadow-lg border border-slate-100">

                        <button onClick={() => changeYear(1)} className="p-4 bg-slate-50 rounded-2xl hover:bg-indigo-50 text-indigo-600 transition-all active:scale-95 shadow-sm border border-slate-100"><Icon name="chevron-right" size={24}/></button>
                    </div>
                    <div className="flex flex-col lg:flex-row gap-8">

                                <h4 className="text-[10px] font-black uppercase text-slate-400 mb-6 tracking-widest flex items-center gap-2 shrink-0"><Icon name="mouse-pointer-2" size={14} className="text-indigo-600" /> Marcador</h4>
                                <div className="space-y-2 overflow-y-auto no-scrollbar flex-1 pb-4 pr-1">
                                    <div className="pb-2 mb-2 border-b border-slate-50">
                                        <p className="text-[8px] font-black text-slate-300 uppercase mb-2">Jornada Base (Esquina)</p>
                                        {combinedTools.filter(t => t.isBase).map(tool => (
                                            <button key={tool.id} onClick={() => setActiveTool(activeTool === tool.id ? null : tool.id)} className={`w-full text-left p-3 rounded-2xl text-[9px] font-black uppercase transition-all border-2 flex items-center justify-between mb-1 ${activeTool === tool.id ? 'border-indigo-600 bg-indigo-50 shadow-md ring-4 ring-indigo-50' : 'border-transparent text-slate-500 hover:bg-slate-50'}`}><span className="truncate pr-2">{tool.label}</span><div onClick={(e) => handleColorClick(e, tool.id)} className={`w-5 h-5 rounded-full shrink-0 border border-black/5 shadow-sm cursor-crosshair hover:scale-125 transition-transform ${tool.customColor ? '' : tool.color}`} style={tool.customColor ? { backgroundColor: tool.customColor } : {}}></div></button>
                                        ))}
                                    </div>
                                    <p className="text-[8px] font-black text-slate-300 uppercase mb-2">Conceptos / Bolsas</p>
                                    {combinedTools.filter(t => !t.isBase).map(tool => (
                                        <div key={tool.id} className="relative group">
                                            <button onClick={() => setActiveTool(activeTool === tool.id ? null : tool.id)} className={`w-full text-left p-3 rounded-2xl text-[9px] font-black uppercase transition-all border-2 flex items-center justify-between ${activeTool === tool.id ? 'border-indigo-600 bg-indigo-50 shadow-md ring-4 ring-indigo-50' : 'border-transparent text-slate-500 hover:bg-slate-50'}`}>
                                                <span className="truncate pr-8">{tool.label}</span>
                                                <div onClick={(e) => handleColorClick(e, tool.id)} className={`w-5 h-5 rounded-full shrink-0 border border-black/5 shadow-sm cursor-crosshair hover:scale-125 transition-transform ${tool.customColor ? '' : tool.color}`} style={tool.customColor ? { backgroundColor: tool.customColor } : {}}></div>
                                            </button>
                                            {tool.isCustom && (
                                                <button onClick={(e) => { e.stopPropagation(); deleteCounter(tool.rawId); }} className="absolute right-10 top-1/2 -translate-y-1/2 p-1.5 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="trash-2" size={12} /></button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <div className="pt-2 border-t border-slate-100 shrink-0">
                                    <button onClick={() => setActiveTool(null)} className="w-full text-center py-3 text-[10px] font-black text-red-500 uppercase tracking-widest hover:bg-red-50 rounded-2xl transition-colors">Limpiar Selección</button>
                                </div>
                            </div>
                        </div>
                        <div className="flex-1 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                            {months.map(m => {
                                const dInM = new Date(year, m + 1, 0).getDate(), fD = (new Date(year, m, 1).getDay() + 6) % 7, mName = new Date(year, m, 1).toLocaleDateString('es-ES', { month: 'long' });
                                return (
                                    <div key={m} className="bg-white p-6 rounded-[32px] shadow-lg border border-slate-100 flex flex-col">
                                        <h5 className="text-xs font-black uppercase text-slate-800 mb-4 text-center tracking-[0.2em]">{mName}</h5>
                                        <div className="grid grid-cols-8 gap-1">
                                            <div className="text-[8px] font-black text-slate-300 text-center py-1">T</div>
                                            {['L','M','X','J','V','S','D'].map(d => <div key={d} className="text-[8px] font-black text-slate-300 text-center py-1">{d}</div>)}
                                            
                                            {(() => {
                                                const weeks = [];
                                                let currentWeek = Array(7).fill(null);
                                                let dayCount = 1;
                                                for (let i = 0; i < fD; i++) currentWeek[i] = null;
                                                for (let i = fD; i < 7; i++) currentWeek[i] = dayCount++;
                                                weeks.push(currentWeek);
                                                while (dayCount <= dInM) {
                                                    currentWeek = Array(7).fill(null);
                                                    for (let i = 0; i < 7 && dayCount <= dInM; i++) currentWeek[i] = dayCount++;
                                                    weeks.push(currentWeek);
                                                }

                                                return weeks.map((week, wIdx) => {
                                                    const weekKey = `w_${year}_${m}_${wIdx}`;
                                                    const weekShift = annualPlan[weekKey] || '';
                                                    const toggleWeekShift = () => {
                                                        const newShift = weekShift === 'M' ? 'T' : (weekShift === 'T' ? '' : 'M');
                                                        const newPlan = { ...annualPlan };
                                                        if (newShift === '') delete newPlan[weekKey];
                                                        else newPlan[weekKey] = newShift;
                                                        setAnnualPlan(newPlan);
                                                        save(newPlan, 'annual_plan');
                                                    };

                                                    return (
                                                        <React.Fragment key={`w-${wIdx}`}>
                                                            <div onClick={toggleWeekShift} className="planner-day h-8 flex items-center justify-center rounded-lg text-[9px] font-black cursor-pointer border shadow-sm transition-all bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border-indigo-100">
                                                                {weekShift}
                                                            </div>
                                                            {week.map((d, dIdx) => {
                                                                if (d === null) return <div key={`e-${wIdx}-${dIdx}`}></div>;
                                                                const ds = toISO(new Date(year, m, d)), p = annualPlan[ds];
                                                                
                                                                let bId = null;
                                                                let activeConceptIds = [];
                                                                let manualHoursSum = 0;
                                                                let hasHours = false;

                                                                if (p) {
                                                                    if (typeof p === 'object') {
                                                                        bId = p.base;
                                                                        if (p.concepts) {
                                                                            activeConceptIds = Object.keys(p.concepts);
                                                                            activeConceptIds.forEach(id => {
                                                                                if (p.concepts[id] !== null && p.concepts[id] !== undefined) {
                                                                                    manualHoursSum += p.concepts[id];
                                                                                    hasHours = true;
                                                                                }
                                                                            });
                                                                        } else if (p.concept) {
                                                                            activeConceptIds = [p.concept];
                                                                            if (p.manualHours !== undefined) {
                                                                                manualHoursSum = p.manualHours;
                                                                                hasHours = true;
                                                                            }
                                                                        }
                                                                    } else if (typeof p === 'string') {
                                                                        if (['intensiva', 'partida'].includes(p)) bId = p;
                                                                        else activeConceptIds = [p];
                                                                    }
                                                                }

                                                                const tB = combinedTools.find(t => t.id === bId);
                                                                const activeToolsList = activeConceptIds.map(id => combinedTools.find(t => t.id === id)).filter(Boolean);

                                                                let dayClass = `planner-day h-8 flex items-center justify-center rounded-lg text-[10px] font-black cursor-pointer border shadow-sm transition-all `;
                                                                let dayStyle = {};

                                                                if (activeToolsList.length === 0) {
                                                                    dayClass += "bg-slate-50 text-slate-400 border-transparent hover:border-indigo-100";
                                                                } else if (activeToolsList.length === 1) {
                                                                    const tC = activeToolsList[0];
                                                                    if (tC.customColor) {
                                                                        dayStyle = { backgroundColor: tC.customColor, color: '#fff', textShadow: '0 1px 2px rgba(0,0,0,0.2)' };
                                                                    } else {
                                                                        dayClass += tC.color;
                                                                    }
                                                                } else {
                                                                    dayClass += "text-white border-transparent ";
                                                                    dayStyle.textShadow = '0 1px 2px rgba(0,0,0,0.5)';
                                                                    const perc = 100 / activeToolsList.length;
                                                                    const stops = activeToolsList.map((tC, i) => {
                                                                        const color = tC.customColor || tC.hex || '#ccc';
                                                                        return `${color} ${i * perc}%, ${color} ${(i + 1) * perc}%`;
                                                                    }).join(', ');
                                                                    dayStyle.background = `linear-gradient(135deg, ${stops})`;
                                                                }

                                                                return (
                                                                    <div key={d} onClick={() => togglePlanDay(ds)} className={dayClass} style={dayStyle}>
                                                                        {tB && <div className="corner-base" style={{ borderLeftColor: 'transparent', borderTopColor: tB.customColor || (tB.id === 'intensiva' ? '#facc15' : '#cbd5e1') }}></div>}
                                                                        {d}
                                                                        {hasHours && <div className="absolute bottom-0 right-0 bg-white/40 px-0.5 rounded-[2px] text-[5px] font-bold text-slate-700 leading-none shadow-sm">{formatTimeStr(manualHoursSum)}</div>}
                                                                    </div>
                                                                );
                                                            })}
                                                        </React.Fragment>
                                                    );
                                                });
                                            })()}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                    <div className="bg-white p-8 rounded-[48px] shadow-2xl border border-slate-100 overflow-hidden">
                        <div className="flex items-center gap-4 mb-8"><div className="p-3 bg-indigo-600 rounded-2xl text-white shadow-lg"><Icon name="database" size={20} /></div><div><h4 className="text-lg font-black text-slate-800 tracking-tight">Conceptos y Bolsas de Horas</h4><p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Gestión de Saldos y Cálculo de Consumo</p></div></div>
                        <div className="overflow-x-auto no-scrollbar">
                            <table className="w-full text-left min-w-[850px]">
                                <thead><tr className="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-50"><th className="pb-4 px-4">Concepto / Año</th><th className="pb-4 px-4 text-right">Total Bolsa</th><th className="pb-4 px-4 text-right">Consumido</th><th className="pb-4 px-4 text-right">Saldo Restante</th><th className="pb-4 px-4 text-center w-20">Acciones</th></tr></thead>
                                <tbody className="divide-y divide-slate-50">
                                    {plannerCounters.map((c, idx) => {
                                        const u = counterUsage[`cnt_${c.id}`] || 0, t = parseTimeStr(c.val), r = t - u;
                                        const customColor = userColors[`cnt_${c.id}`];
                                        return <tr key={c.id} className="group hover:bg-slate-50/50 transition-all"><td className="py-4 px-4 flex items-center gap-3"><div onClick={(e) => handleColorClick(e, `cnt_${c.id}`)} className={`w-4 h-4 rounded-full shrink-0 border border-black/5 cursor-crosshair hover:scale-125 transition-all shadow-sm ${customColor ? '' : DYNAMIC_PLANNER_COLORS[idx % DYNAMIC_PLANNER_COLORS.length].bg}`} style={customColor ? { backgroundColor: customColor } : {}}></div><input type="text" className="w-full bg-transparent text-xs font-black text-slate-700 uppercase outline-none focus:text-indigo-600 focus:bg-indigo-50/50 rounded-lg px-2 py-1 transition-all" value={c.desc} onChange={e => updateCounter(c.id, 'desc', e.target.value)} /></td><td className="py-4 px-4 text-right"><input type="text" className="w-24 bg-slate-50 text-xs font-black text-slate-900 text-right outline-none focus:ring-2 focus:ring-indigo-200 rounded-lg px-3 py-1.5 transition-all border border-slate-100" value={c.val} onChange={e => updateCounter(c.id, 'val', e.target.value)} /></td><td className="py-4 px-4 text-right font-black text-xs text-red-500">{formatTimeStr(u)}h</td><td className={`py-4 px-4 text-right font-black text-xs ${r < 0 ? 'text-red-600' : 'text-emerald-600'}`}>{formatTimeStr(r)}h</td><td className="py-4 px-4 text-center"><button onClick={() => deleteCounter(c.id)} className="p-2 text-slate-200 hover:text-red-500 transition-colors"><Icon name="trash-2" size={16} /></button></td></tr>;
                                    })}
                                </tbody>
                            </table>
                        </div>
                        <div className="mt-8 pt-8 border-t border-slate-50 flex justify-end"><button onClick={() => { const nI = plannerCounters.length > 0 ? Math.max(...plannerCounters.map(c => c.id)) + 1 : 1; const nC = [...plannerCounters, { id: nI, desc: "NUEVO CONCEPTO", val: "00:00" }]; setPlannerCounters(nC); save(nC, 'planner_counters'); }} className="flex items-center gap-2 px-6 py-3 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-indigo-600 transition-all shadow-xl active:scale-95"><Icon name="plus" size={14} /> Añadir Concepto</button></div>
                    </div>
                </div>
            );
        };

        const PriceConfigPage = ({ globalRates, setGlobalRates, salaryMatrix, setSalaryMatrix, profile, save }) => {
            const [lG, slG] = useState(globalRates), [lM, slM] = useState(salaryMatrix);

            return (
                <div className="space-y-12 animate-in pb-20">
                    <section className="bg-white p-8 rounded-[40px] shadow-xl border border-slate-100"><div className="flex justify-between items-center mb-10"><div><h3 className="text-xl font-black uppercase tracking-tight">Tarifas Globales</h3></div><button onClick={sv} className="px-8 py-3 bg-indigo-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-lg active:scale-95">Guardar</button></div><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">{Object.entries(lG).filter(([k]) => !['CALL_L', 'CALL_F'].includes(k)).map(([k, v]) => (<div key={k} className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase ml-2 leading-tight block">{GLOBAL_LABELS[k] || k}</label><div className="relative"><input type="number" step="0.01" className="w-full bg-slate-50 p-4 rounded-2xl border-2 border-slate-100 font-black text-slate-800 outline-none" value={v} onChange={e => slG({...lG, [k]: parseFloat(e.target.value) || 0})} /><span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 font-black text-[10px]">€</span></div></div>))}</div></section>
                    <section className="bg-slate-900 p-8 rounded-[40px] shadow-2xl overflow-x-auto no-scrollbar">
                        <h3 className="text-xl font-black text-white mb-10 uppercase tracking-tight">Matriz Salarial ({profile.group})</h3>
                        <table className="w-full text-left min-w-[1050px]">
                            <thead>
                                <tr className="text-[10px] font-black text-slate-500 uppercase border-b border-slate-800">
                                    <th className="pb-4 px-4">Grupo y Nivel</th>
                                    <th className="pb-4 px-4 text-center text-indigo-400">H. Ordinaria</th>
                                    {['TRC', 'C. TRC', 'TRA', 'HE', 'Noche', 'Plus Llamada', 'Retén L', 'Retén F'].map(h => <th key={h} className="pb-4 px-4 text-center">{h}</th>)}
                                </tr>
                            </thead>
                            <tbody>
                                {Object.entries(lM).filter(([g]) => g === profile.group).map(([g, rgs]) => 
                                    Object.entries(rgs).filter(([r]) => r === (parseInt(profile.level) <= 9 ? "1-9" : "10-12")).map(([r, d]) => (
                                        <tr key={`${g}-${r}`} className="border-b border-slate-800/50 bg-white/5 hover:bg-white/10 transition-all">
                                            <td className="py-4 px-4 min-w-[120px]">
                                                <span className="text-xs font-black block text-indigo-400">{g}</span>
                                                <span className="text-[9px] font-bold text-slate-500 uppercase">Nivel {profile.level} ({r})</span>
                                            </td>
                                            <td className="py-2 px-2 text-center">
                                                <span className="text-[11px] font-bold text-slate-500 italic">{((d.extra || 0) / 1.75).toLocaleString('es-ES', { minimumFractionDigits: 6, maximumFractionDigits: 6 })}€</span>
                                            </td>
                                            {['trc', 'trc_comp', 'tra', 'extra', 'night', 'call', 'r_l', 'r_f'].map(f => (
                                                <td key={f} className="py-2 px-2">
                                                    <input 
                                                        type="number" 
                                                        step="0.01" 
                                                        className="w-full bg-slate-800/50 p-2 rounded-xl text-center text-xs font-bold border outline-none text-indigo-400 focus:border-indigo-500 border-transparent transition-all" 
                                                        value={d[f] !== undefined ? d[f] : ''} 
                                                        onChange={e => { const nM = {...lM}; nM[g][r][f] = parseFloat(e.target.value) || 0; slM(nM); }} 
                                                    />
                                                </td>
                                            ))}
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </section>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [viewDate, setViewDate] = useState(new Date());
            const [shifts, setShifts] = useState({});
            const [annualPlan, setAnnualPlan] = useState({});
            const [userColors, setUserColors] = useState({});
            const [plannerCounters, setPlannerCounters] = useState(DEFAULT_PLANNER_COUNTERS);
            const [profile, setProfile] = useState({ group: "G V", level: "7", kmCount: 46, retention: 0 });
            const [globalRates, setGlobalRates] = useState(DEFAULT_GLOBAL_CONST);
            const [salaryMatrix, setSalaryMatrix] = useState(DEFAULT_SALARY_DATA);
            const [selected, setSelected] = useState(null);
            const [ui, setUi] = useState({ modal: false, settings: false, tab: 'calendar', error: '', info: '', colorPicker: null });
            const [authFields, setAuthFields] = useState({ email: '', pass: '', mode: 'login' });
            const [isIncognito, setIsIncognito] = useState(false);
            const [isRetentionActive, setIsRetentionActive] = useState(false);
            const [showPirateAnimation, setShowPirateAnimation] = useState(false);
            const [activeTool, setActiveTool] = useState(null);

            const save = useCallback(async (data, path) => {
                if (!user) return;
                try { await setDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', path), { data, updatedAt: Date.now() }); } catch (e) { setUi(prev => ({ ...prev, error: 'Error de sincronización' })); }
            }, [user]);

            useEffect(() => {
                const unsubAuth = onAuthStateChanged(auth, (u) => { setUser(u); setLoading(false); if (!u) { setShifts({}); setAnnualPlan({}); setPlannerCounters(DEFAULT_PLANNER_COUNTERS); setUserColors({}); setProfile({ group: "G V", level: "7", kmCount: 46, retention: 0 }); } });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubs = [
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'shifts'), snap => snap.exists() && setShifts(snap.data().data || {}), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'annual_plan'), snap => snap.exists() && setAnnualPlan(snap.data().data || {}), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'planner_counters'), snap => snap.exists() && setPlannerCounters(snap.data().data || DEFAULT_PLANNER_COUNTERS), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'profile'), snap => snap.exists() && setProfile(p => ({ ...p, ...snap.data().data })), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'globalRates'), snap => snap.exists() && setGlobalRates(snap.data().data || DEFAULT_GLOBAL_CONST), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'salaryMatrix'), snap => snap.exists() && setSalaryMatrix(snap.data().data || DEFAULT_SALARY_DATA), () => {}),
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'data', 'userColors'), snap => snap.exists() && setUserColors(snap.data().data || {}), () => {})
                ];
                return () => unsubs.forEach(un => un());
            }, [user]);

            const rates = useMemo(() => {
                const g = salaryMatrix[profile.group] || salaryMatrix["G V"];
                const lvl = parseInt(profile.level) || 1;
                const range = lvl <= 9 ? "1-9" : "10-12";
                return g[range] || g["1-9"];
            }, [profile, salaryMatrix]);

            const getPlanConcepts = (planDay) => {
                if (!planDay) return [];
                if (typeof planDay === 'object') {
                    if (planDay.concepts) return Object.keys(planDay.concepts);
                    if (planDay.concept) return [planDay.concept];
                }
                if (typeof planDay === 'string' && !['intensiva', 'partida'].includes(planDay)) return [planDay];
                return [];
            };

            const calcDay = useCallback((dateStr, data, plan, allShifts) => {
                if (!data) return { total: 0, restHours: 0, items: [] };
                const d = new Date(dateStr), isSunday = d.getDay() === 0, isSaturday = d.getDay() === 6;
                const planDay = plan?.[dateStr];
                
                const isPlanFestive = getPlanConcepts(planDay).some(c => ['cnt_1', 'cnt_3', 'festivo_especial'].includes(c));
                const isF = isSunday || isSaturday || data.isFestive || isPlanFestive;
                const isFriday = d.getDay() === 5;
                const retentionMultiplier = isRetentionActive ? (1 - (parseFloat(profile.retention) || 0) / 100) : 1;
                const res = { total: 0, restHours: 0, items: [] };
                const add = (label, val, type, qty = 1) => { 
                    if (val > 0) { 
                        const netVal = val * retentionMultiplier;
                        res.total += netVal; 
                        res.items.push({ label, value: netVal, type, qty }); 
                    } 
                };
                
                // Lógica de Descanso Compensatorio (Si el siguiente es laboral)
                if (isF && data.shift && data.shift !== 'D') {
                    const nextDay = new Date(d); nextDay.setDate(d.getDate() + 1);
                    const nextDayISO = toISO(nextDay); 
                    const nDayData = allShifts?.[nextDayISO];
                    const nDayPlan = plan?.[nextDayISO];
                    const isNextPlanFestive = getPlanConcepts(nDayPlan).some(c => ['cnt_1', 'cnt_3', 'festivo_especial'].includes(c));
                    const isNextWeekend = nextDay.getDay() === 0 || nextDay.getDay() === 6;
                    
                    if (!(isNextWeekend || nDayData?.isFestive || isNextPlanFestive)) {
                        const nextDayBase = typeof nDayPlan === 'object' ? nDayPlan?.base : nDayPlan;
                        const restAmount = nextDayBase === 'intensiva' ? 7.5 : nextDayBase === 'partida' ? 8.5 : 8;
                        res.restHours += restAmount; 
                        res.items.push({ 
                            label: isSunday ? `Descanso Domingo (${restAmount}h)` : (isSaturday ? `Descanso Sábado (${restAmount}h)` : `Descanso Festivo (${restAmount}h)`), 
                            value: restAmount, type: 'coffee', qty: restAmount 
                        });
                    }
                }
                
                const trcRate = rates.trc !== undefined ? rates.trc : (globalRates.TRC || 55.01);
                const traRate = rates.tra !== undefined ? rates.tra : (globalRates.TRA || 20.90);

                if (data.isReten) add(`Retén ${isF ? 'F' : 'L'}`, isF ? rates.r_f : rates.r_l, 'reten', 1);
                const concepts = data.activeConceptsCount || {};
                
                const countKmBase = parseFloat(concepts['comp_km']) || 0;
                const baseKm = countKmBase * (profile.kmCount || 0);
                const manualKm = parseFloat(data.extraKm) || 0;
                const tKm = baseKm + manualKm;
                
                if (tKm > 0) add(`Kilometraje (${tKm}km)`, tKm * globalRates.KM_PRICE, 'km', tKm);
                
                Object.entries(concepts).forEach(([id, count]) => {
                    if (count <= 0 || id === 'comp_km') return;
                    if ((data.shift === 'R7' || data.shift === 'R9') && ['plus_llamada', 'comp_llamada'].includes(id) && !isF) return;
                    if (id === 'trc') { let m = data.shift === 'R7' ? 1.5 : data.shift === 'R9' ? 2.5 : data.shift === 'S5' ? (isF ? 3 : 2) : (['S1', 'S3'].includes(data.shift) ? (isF ? 2 : 1) : 1); add(`Plus TRC ${m}x (x${count})`, (trcRate * m) * count, 'trc', m * count); }
                    if (id === 'trc_comp') add(`Comp. TRC 25% (x${count})`, (rates.trc_comp || 0) * count, 'trc_comp', count);
                    if (id === 'tra') add(`Plus TRA ${isF ? 3 : 2}x (x${count})`, (traRate * (isF ? 3 : 2)) * count, 'tra', count);
                    if (id === 'plus_llamada') add(`Plus Llamada (x${count})`, rates.call * count, 'call_plus', count);
                    if (id === 'comp_llamada' && !data.isReten) add(`Comp. Llamada (x${count})`, (isF ? rates.r_f : rates.r_l) * count, 'call_comp', count);
                    if (id === 'comida') add(`Ayuda Comida (x${count})`, globalRates.FOOD * count, 'food', count);
                    if (id === 'otros' && parseFloat(data.otrosValue) > 0) add(data.otrosLabel || 'Otros', parseFloat(data.otrosValue) * count, 'custom', count);
                });
                
                if (data.shift === 'P1') add(`Plus P1 ${isFriday ? '(Viernes)' : ''}`, isFriday ? globalRates.P1_FRI : globalRates.P1_BASE, 'p1', 1);
                
                if (data.shift && data.shift !== 'D') {
                    let h = parseFloat(data.extras) || 0;
                    if (h > 0) {
                        const hasNightHours = parseFloat(data.horasNocturnas) > 0;
                        const isNf = isF || hasNightHours;
                        if (data.extraCompMode === 'mixed') { res.restHours += h; res.items.push({ label: `Descanso HE (1x)`, value: h, type: 'coffee', qty: h }); add(`HE Cobro (0.75x HO)`, h * (rates.extra / 1.75) * 0.75, 'he', h); }
                        else if (data.extraCompMode === 'rest_total') { const mult = isNf ? 2.0 : 1.75; res.restHours += h * mult; res.items.push({ label: `Descanso HE (${mult}x)`, value: h * mult, type: 'coffee', qty: h * mult }); }
                        else add(`HE Cobro 100%`, h * rates.extra, 'he', h);
                    }
                    if (parseFloat(data.horasNocturnas) > 0) add(`Nocturnidad ${data.horasNocturnas}h`, parseFloat(data.horasNocturnas) * rates.night, 'night', parseFloat(data.horasNocturnas));
                }
                return res;
            }, [rates, globalRates, profile.kmCount, profile.retention, isRetentionActive]);

            const stats = useMemo(() => {
                const init = () => ({ val: 0, count: 0 });
                const s = { month: { total: 0, trc: init(), tra: init(), call_plus: init(), call_comp: init(), food: init(), km: init(), he: init(), night: init(), reten: init(), restHours: 0, custom: init(), p1: init(), trc_comp: init() } };
                Object.entries(shifts).forEach(([ds, data]) => {
                    const c = calcDay(ds, data, annualPlan, shifts);
                    const [y, m] = ds.split('-').map(Number);
                    if (y === viewDate.getFullYear() && m === (viewDate.getMonth() + 1)) {
                        s.month.total += c.total; s.month.restHours += c.restHours;
                        c.items.forEach(i => { if (s.month[i.type]) { s.month[i.type].val += i.value; s.month[i.type].count += (i.qty || 1); } });
                    }
                });
                return s;
            }, [shifts, viewDate, calcDay, annualPlan]);

            const chartData = useMemo(() => {
                const f = (q) => Number(q.toFixed(2));
                return [ { label: `Plus TRC (x${f(stats.month.trc.count)})`, value: stats.month.trc.val, color: '#6366f1' }, { label: `Comp. TRC (x${f(stats.month.trc_comp.count)})`, value: stats.month.trc_comp.val, color: '#0d9488' }, { label: `Plus TRA (x${f(stats.month.tra.count)})`, value: stats.month.tra.val, color: '#f59e0b' }, { label: `Plus Llamada (x${f(stats.month.call_plus.count)})`, value: stats.month.call_plus.val, color: '#ef4444' }, { label: `Comp. Llamada (x${f(stats.month.call_comp.count)})`, value: stats.month.call_comp.val, color: '#f43f5e' }, { label: `Ayuda Comida (x${f(stats.month.food.count)})`, value: stats.month.food.val, color: '#10b981' }, { label: `Kilometraje (${f(stats.month.km.count)}km)`, value: stats.month.km.val, color: '#0ea5e9' }, { label: `Horas Extras (${f(stats.month.he.count)}h)`, value: stats.month.he.val, color: '#8b5cf6' }, { label: `Nocturnidad (${f(stats.month.night.count)}h)`, value: stats.month.night.val, color: '#334155' }, { label: `Retén Total (x${f(stats.month.reten.count)})`, value: stats.month.reten.val, color: '#4f46e5' }, { label: `Plus P1 (x${f(stats.month.p1.count)})`, value: stats.month.p1.val, color: '#94a3b8' }, { label: `Otros (x${f(stats.month.custom.count)})`, value: stats.month.custom.val, color: '#cbd5e1' } ].filter(d => d.value > 0);
            }, [stats]);

            const counterUsage = useMemo(() => {
                const usage = {};
                Object.entries(annualPlan).forEach(([ds, plan]) => {
                    if (!plan) return;
                    let base = null;
                    let concepts = {};

                    if (typeof plan === 'object') {
                        base = plan.base;
                        if (plan.concepts) concepts = plan.concepts;
                        else if (plan.concept) concepts[plan.concept] = plan.manualHours !== undefined ? plan.manualHours : null;
                    } else if (typeof plan === 'string') {
                        if (['intensiva', 'partida'].includes(plan)) base = plan;
                        else concepts[plan] = null;
                    }

                    Object.entries(concepts).forEach(([cId, hrs]) => {
                        usage[cId] = (usage[cId] || 0) + (hrs !== null && hrs !== undefined ? hrs : (base === 'intensiva' ? 7.5 : base === 'partida' ? 8.5 : 8));
                    });
                });
                return usage;
            }, [annualPlan]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setUi({...ui, error: '', info: ''});
                try { 
                    if (authFields.mode === 'register') await createUserWithEmailAndPassword(auth, authFields.email, authFields.pass); 
                    else await signInWithEmailAndPassword(auth, authFields.email, authFields.pass); 
                } catch (err) { setUi(p => ({ ...p, error: 'Error de acceso.' })); }
            };

            if (loading) return <div className="min-h-screen bg-slate-900 flex items-center justify-center"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>;
            if (!user) return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6">
                    <div className="bg-slate-900 w-full max-sm rounded-[40px] shadow-2xl p-10 border border-slate-800 animate-in">
                        <div className="flex flex-col items-center mb-10"><Icon name="calendar" size={40} className="text-indigo-500 mb-4" /><h1 className="text-2xl font-black text-white uppercase tracking-tight">ShiftExpert</h1></div>
                        {(ui.error || ui.info) && <div className={`p-3 rounded-xl text-xs font-bold text-center mb-4 ${ui.error ? 'bg-red-500/10 text-red-500' : 'bg-emerald-500/10 text-emerald-500'}`}>{ui.error || ui.info}</div>}
                        <form onSubmit={handleAuth} className="space-y-4">
                            <input type="email" required className="w-full bg-slate-800 p-4 rounded-2xl text-white text-sm" placeholder="Email" value={authFields.email} onChange={e => setAuthFields({...authFields, email: e.target.value})} />
                            <input type="password" required className="w-full bg-slate-800 p-4 rounded-2xl text-white text-sm" placeholder="Contraseña" value={authFields.pass} onChange={e => setAuthFields({...authFields, pass: e.target.value})} />
                            <button type="submit" className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl uppercase text-xs tracking-widest">{authFields.mode === 'login' ? 'Entrar' : 'Registrarse'}</button>
                            <button type="button" onClick={() => setAuthFields({...authFields, mode: authFields.mode === 'login' ? 'register' : 'login'})} className="w-full text-[10px] font-black text-slate-500 uppercase tracking-widest mt-2">{authFields.mode === 'login' ? 'Crear Cuenta' : 'Tengo cuenta'}</button>
                            {authFields.mode === 'login' && (
                                <button type="button" onClick={async () => { if(!authFields.email) { setUi(p => ({...p, error: 'Introduce tu email en el campo superior.', info: ''})); return; } try { await sendPasswordResetEmail(auth, authFields.email); setUi(p => ({...p, info: 'Email de recuperación enviado.', error: ''})); } catch(e) { setUi(p => ({...p, error: 'Error al enviar email.', info: ''})); } }} className="w-full text-[10px] font-black text-indigo-400 uppercase tracking-widest mt-4 hover:text-indigo-300 transition-colors">Recuperar contraseña</button>
                            )}
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 pb-20">
                    <div className="w-full bg-slate-900 text-slate-400 py-2 px-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest shadow-md"><div className="flex items-center gap-2"><Icon name="user" size={12} className="text-indigo-500" /><span className="text-white">Sesión activa: {user?.email}</span></div><div className="hidden md:block italic opacity-50">ShiftExpert</div></div>
                    <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-6"><div className="flex items-center gap-5"><div className="bg-indigo-600 p-5 rounded-3xl text-white shadow-xl rotate-3"><Icon name="calendar" size={28} /></div><div><h2 className="text-2xl font-black text-slate-900 tracking-tight">ShiftExpert</h2><p className="text-[10px] font-black uppercase text-indigo-500 tracking-widest">GESTIÓN DE TURNOS</p></div></div><div className="flex bg-white p-1.5 rounded-[24px] shadow-lg border border-slate-100 overflow-hidden items-center"><button onClick={() => { const n = !isRetentionActive; setIsRetentionActive(n); if (n) { setShowPirateAnimation(true); setTimeout(() => setShowPirateAnimation(false), 3000); } }} className={`px-4 py-3 rounded-2xl flex items-center gap-2 transition-all mr-1 ${isRetentionActive ? 'bg-black text-white shadow-md' : 'bg-transparent text-slate-400 hover:text-black'}`}><Icon name="skull" size={16} /><span className="text-[10px] font-black uppercase">{isRetentionActive ? 'ON' : '% Ret'}</span></button><button onClick={() => setIsIncognito(!isIncognito)} className={`px-4 py-3 rounded-2xl flex items-center gap-2 transition-all mr-1 ${isIncognito ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-indigo-600'}`}><Icon name={isIncognito ? "eye-off" : "eye"} size={16} /><span className="text-[10px] font-black uppercase">{isIncognito ? 'ON' : 'Incógnito'}</span></button>{['calendar', 'planner', 'stats', 'precios'].map(t => (<button key={t} onClick={() => setUi({...ui, tab: t})} className={`px-8 py-3 rounded-2xl text-[10px] font-black uppercase transition-all ${ui.tab === t ? 'bg-slate-900 text-white shadow-md scale-105' : 'text-slate-400 hover:text-slate-600'}`}>{t === 'precios' ? 'Precios' : t === 'stats' ? 'Balance' : t === 'planner' ? 'Planificador' : 'Calendario'}</button>))}<button onClick={() => setUi({...ui, settings: true})} className="px-4 py-3 text-indigo-400 hover:text-indigo-600"><Icon name="user-cog" size={18}/></button><button onClick={() => signOut(auth)} className="px-4 py-3 text-red-400 hover:text-red-600"><Icon name="log-out" size={18}/></button></div></div>
                        
                        {showPirateAnimation && (
                            <div className="fixed inset-0 z-[9999] flex items-center justify-center pointer-events-none bg-black/40 backdrop-blur-sm flag-container">
                                <div className="w-[80vw] md:w-[60vw] max-w-3xl aspect-[3/2] bg-[#111] border-l-[16px] border-[#222] flex flex-col items-center justify-center shadow-[30px_20px_60px_rgba(0,0,0,0.8)] flag-wave rounded-r-2xl relative">
                                    <div className="relative z-10 flex flex-col items-center justify-center h-full w-full pt-4">
                                        <Icon name="skull" size={180} className="text-[#f1f1f1] drop-shadow-[0_5px_15px_rgba(0,0,0,1)]" />
                                        <span className="text-[#f1f1f1] text-5xl md:text-7xl font-black tracking-[0.1em] uppercase mt-10 drop-shadow-[0_5px_15px_rgba(0,0,0,1)]" style={{ transform: 'scaleY(1.2)' }}>Retención</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {ui.tab === 'calendar' && (
                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-8 animate-in">
                                <div className="lg:col-span-3 bg-white shadow-2xl rounded-[48px] overflow-hidden border border-slate-100">

className="text-[10px] font-black uppercase text-slate-400 block mb-4">% Retención</label><input type="number" className="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 text-2xl font-black text-slate-800 outline-none focus:border-indigo-600" value={profile.retention || 0} onChange={e => { const np = {...profile, retention: parseFloat(e.target.value) || 0}; setProfile(np); save(np, 'profile'); }} /></section></div></div><button onClick={() => setUi({...ui, settings: false})} className="w-full mt-10 py-5 bg-slate-900 text-white font-black rounded-3xl uppercase text-xs">Listo</button></div></div>}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
